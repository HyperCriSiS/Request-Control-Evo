<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../util/badges.css" />
        <link rel="stylesheet" href="browser-action.css" />
        <script defer type="module" src="../util/i18n.js"></script>
        <script defer type="module" src="browser-action.js"></script>
    </head>
    <body>
        <div class="content">
            <div id="records" class="hidden"></div>
            <div class="header">
                <button id="showRules" class="btn" type="button" data-i18n="options_title"></button>
                <button
                    id="inspectCurrent"
                    class="btn"
                    type="button"
                    data-i18n-title="inspection_title"
                    data-i18n-aria-label="inspection_title"
                >
                    <img src="/icons/ionicons/list-outline.svg" width="18" alt="" />
                    <span data-i18n="inspection_title"></span>
                </button>
                <button
                    id="analyzeCurrent"
                    class="btn"
                    type="button"
                    data-i18n-title="analyzer_title"
                    data-i18n-aria-label="analyzer_title"
                >
                    <img src="/icons/ionicons/shuffle-outline.svg" width="18" alt="" />
                </button>
                <button id="toggleActive" class="btn" type="button"></button>
            </div>
        </div>
        <div id="details" class="hidden">
            <div class="text-shortcut">
                <button type="button" class="copyButton tooltip" data-copy-target="url" data-i18n-title="copy_to_clipboard">
                    <img src="/icons/firefox/copy.svg" width="20" alt="" />
                    <span class="tooltiptext" data-i18n="copied"></span>
                </button>
            </div>
            <small data-i18n="request_url"></small>
            <pre id="url"></pre>
            <div id="targetBlock" class="hidden">
                <div class="text-shortcut">
                    <button type="button" class="copyButton tooltip" data-copy-target="target" data-i18n-title="copy_to_clipboard">
                        <img src="/icons/firefox/copy.svg" width="20" alt="" />
                        <span class="tooltiptext" data-i18n="copied"></span>
                    </button>
                </div>
                <small data-i18n="new_target"></small>
                <pre id="target"></pre>
            </div>
            <a id="editLink" href="" data-i18n="edit_rule"></a>
        </div>
        <template id="entryTemplate">
            <div class="entry">
                <button type="button" class="entry-header">
                    <small class="timestamp"></small>
                    <img class="icon" src="/icons/icon.svg" height="16" alt="" />
                    <span class="action"></span>
                    <span class="url"></span>
                    <span class="entry-badges">
                        <span class="tags badge badge-light"></span>
                        <span class="type badge badge-info"></span>
                    </span>
                </button>
            </div>
        </template>
    </body>
</html>
