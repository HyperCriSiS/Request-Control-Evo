<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../util/badges.css" />
        <link rel="stylesheet" href="browser-action.css" />
        <script defer type="module" src="../util/i18n.js"></script>
        <script defer type="module" src="browser-action.js"></script>
    </head>
    <body>
        <div class="content">
            <div id="records" class="hidden"></div>
            <div class="header">
                <button id="showRules" class="btn" type="button" data-i18n="options_title"></button>
                <button
                    id="inspectCurrent"
                    class="btn"
                    type="button"
                    data-i18n-title="inspection_title"
                    data-i18n-aria-label="inspection_title"
                >
                    <img src="/icons/ionicons/list-outline.svg" width="18" alt="" />
                    <span data-i18n="inspection_title"></span>
                </button>
                <button id="toggleActive" class="btn" type="button"></button>
            </div>
            <section id="referrerControl" class="referrer-control" aria-labelledby="referrerControlTitle">
                <div class="referrer-control-head">
                    <div class="referrer-control-copy">
                        <strong id="referrerControlTitle" data-i18n="referrer_title"></strong>
                        <span id="referrerHost" class="referrer-host"></span>
                    </div>
                    <label class="referrer-mode-field">
                        <span class="visually-hidden" data-i18n="referrer_mode"></span>
                        <select id="referrerMode" data-i18n-title="referrer_mode">
                            <option value="browser" data-i18n="referrer_browser"></option>
                            <option value="balanced" data-i18n="referrer_balanced"></option>
                            <option value="same-origin" data-i18n="referrer_same_origin"></option>
                            <option value="no-referrer" data-i18n="referrer_none"></option>
                        </select>
                    </label>
                </div>
                <div id="referrerHostRow" class="referrer-host-row hidden">
                    <span class="referrer-scope"><span data-i18n="host"></span>: <span id="referrerHostScope"></span></span>
                    <button id="toggleReferrerHost" class="btn referrer-host-button" type="button"></button>
                </div>
                <p class="referrer-note" data-i18n="referrer_note"></p>
            </section>
        </div>
        <div id="details" class="hidden">
            <div class="text-shortcut">
                <button type="button" class="copyButton tooltip" data-copy-target="url" data-i18n-title="copy_to_clipboard">
                    <img src="/icons/firefox/copy.svg" width="20" alt="" />
                    <span class="tooltiptext" data-i18n="copied"></span>
                </button>
            </div>
            <small data-i18n="request_url"></small>
            <pre id="url"></pre>
            <div id="targetBlock" class="hidden">
                <div class="text-shortcut">
                    <button type="button" class="copyButton tooltip" data-copy-target="target" data-i18n-title="copy_to_clipboard">
                        <img src="/icons/firefox/copy.svg" width="20" alt="" />
                        <span class="tooltiptext" data-i18n="copied"></span>
                    </button>
                </div>
                <small data-i18n="new_target"></small>
                <pre id="target"></pre>
            </div>
            <a id="editLink" href="" data-i18n="edit_rule"></a>
        </div>
        <template id="entryTemplate">
            <div class="entry">
                <button type="button" class="entry-header">
                    <small class="timestamp"></small>
                    <img class="icon" src="/icons/icon.svg" height="16" alt="" />
                    <span class="action"></span>
                    <span class="url"></span>
                    <span class="entry-badges">
                        <span class="tags badge badge-light"></span>
                        <span class="type badge badge-info"></span>
                    </span>
                </button>
            </div>
        </template>
    </body>
</html>
