<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/lib/lit/lit.css" />
        <link rel="stylesheet" href="../util/badges.css" />
        <link rel="stylesheet" href="common.css" />
        <link rel="stylesheet" href="alert-popup.css" />
        <link rel="stylesheet" href="loading-dots.css" />
        <link rel="stylesheet" href="modal-dialog.css" />
        <link rel="stylesheet" href="rule-import-input.css" />
        <link rel="stylesheet" href="rule-input.css" />
        <link rel="stylesheet" href="rule-list.css" />
        <link rel="stylesheet" href="rule-tester.css" />
        <link rel="stylesheet" href="options.css" />
        <script defer type="module" src="../util/i18n.js"></script>
        <script defer src="loading-dots.js"></script>
        <script defer src="rule-import-input.js"></script>
        <script defer type="module" src="rule-input.js"></script>
        <script defer type="module" src="rule-list.js"></script>
        <script defer type="module" src="options.js"></script>
    </head>
    <body>
        <div class="c">
            <div id="tabs" class="row">
                <div class="col">
                    <a class="tab-selector" href="#tab-rules">
                        <img src="/icons/ionicons/list.svg" height="20" />
                        <span data-i18n="rules"></span>
                    </a>
                </div>
                <div class="col">
                    <a class="tab-selector" href="#tab-settings">
                        <img src="/icons/ionicons/settings.svg" height="20" />
                        <span data-i18n="settings"></span>
                    </a>
                </div>
                <div class="col">
                    <a class="tab-selector" href="#tab-imports">
                        <img src="/icons/ionicons/cloud-download.svg" height="20" />
                        <span data-i18n="imports"></span>
                    </a>
                </div>
                <div class="col">
                    <a class="tab-selector" href="#tab-manual">
                        <img src="/icons/ionicons/help-circle.svg" height="20" />
                        <span data-i18n="manual"></span>
                    </a>
                </div>
            </div>
            <div class="tab-content">
                <div id="tab-rules" class="tab-pane active">
                    <div class="no-rules-block d-none">
                        <div class="no-rules">
                            <p data-i18n="no_rules"></p>
                            <p class="create-or-import" data-i18n="create_or_import"><a class="create-or-import-link" href="#tab-imports"></a></p>
                        </div>
                    </div>
                    <rule-list id="new"></rule-list>
                    <rule-list id="filter"></rule-list>
                    <rule-list id="redirect"></rule-list>
                    <rule-list id="secure"></rule-list>
                    <rule-list id="block"></rule-list>
                    <rule-list id="whitelist"></rule-list>
                    <div class="toolbar sticky">
                        <div>
                            <button id="addNewRule" class="btn primary">
                                <img src="/icons/ionicons/add-circle-outline.svg" width="20" />
                                <span data-i18n="create_rule"></span>
                            </button>
                            <button id="selectedRules" class="btn d-none-mobile"></button>
                        </div>
                        <div class="d-none-mobile">
                            <button id="testSelectedRules" class="btn btn-selected-action" disabled>
                                <img src="/icons/ionicons/flask-outline.svg" width="20" />
                                <span data-i18n="test_selected"></span>
                            </button>
                            <button id="exportSelectedRules" class="btn btn-selected-action" disabled>
                                <img src="/icons/ionicons/download-outline.svg" width="20" />
                                <span data-i18n="export_selected"></span>
                            </button>
                            <button id="removeSelectedRules" class="btn btn-danger btn-selected-action" disabled>
                                <img src="/icons/ionicons/trash-bin-outline.svg" width="20" />
                                <span data-i18n="remove_selected"></span>
                            </button>
                        </div>
                    </div>
                    <div class="mobile-toolbar">
                        <button id="testSelectedRulesMobile" class="btn btn-selected-action" disabled onclick="document.getElementById('testSelectedRules').click()">
                            <img src="/icons/ionicons/flask-outline.svg" width="20" />
                            <span data-i18n="test_selected"></span>
                        </button>
                        <button id="exportSelectedRulesMobile" class="btn btn-selected-action" disabled onclick="document.getElementById('exportSelectedRules').click()">
                            <img src="/icons/ionicons/download-outline.svg" width="20" />
                            <span data-i18n="export_selected"></span>
                        </button>
                        <button id="removeSelectedRulesMobile" class="btn btn-danger btn-selected-action" disabled onclick="document.getElementById('removeSelectedRules').click()">
                            <img src="/icons/ionicons/trash-bin-outline.svg" width="20" />
                            <span data-i18n="remove_selected"></span>
                        </button>
                    </div>
                </div>
                <div id="tab-settings" class="tab-pane">
                    <h3 data-i18n="settings"></h3>
                    <h4 data-i18n="toolbar"></h4>
                    <label class="btn">
                        <input id="optionShowCounter" type="checkbox" />
                        <span data-i18n="show_counter"></span>
                    </label>
                    <label class="btn">
                        <input id="optionChangeIcon" type="checkbox" />
                        <span data-i18n="change_icon"></span>
                    </label>
                    <h4 data-i18n="rules"></h4>
                    <div>
                        <button id="exportRules" class="btn">
                            <img src="/icons/ionicons/download-outline.svg" width="20" />
                            <span data-i18n="export"></span>
                        </button>
                        <label class="btn">
                            <img src="/icons/ionicons/cloud-upload-outline.svg" width="20" />
                            <span data-i18n="import"></span>
                            <input id="importRules" class="v-hidden" type="file" accept=".json,text/plain" />
                        </label>
                    </div>
                    <hr />
                    <div>
                        <p><span id="version"></span> - <button id="changelog" class="btn text" data-i18n="changelog"></button> - <a href="https://github.com/tumpio/requestcontrol" data-i18n="homepage"></a></p>
                        <p data-i18n="license_short"></p>
                    </div>
                </div>
                <div id="tab-imports" class="tab-pane">
                    <h3 data-i18n="imports"></h3>
                    <details open>
                        <summary data-i18n="my_lists"></summary>
                        <ul id="my-import-sources"></ul>
                        <form id="import-source-form">
                            <input id="new-import-source" name="src" type="url" required placeholder="https://example.com/rules.json" />
                            <button class="btn" type="submit" data-i18n="add"></button>
                        </form>
                    </details>
                    <details open>
                        <summary data-i18n="common"></summary>
                        <ul>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-common-redirectors.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_skip_redirectors"></span></rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-common-params.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_remove_parameters"></span></rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-common-images.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_remove_image_parameters"></span></rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-block-beacon-and-ping.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_block_beacon_and_ping"></span></rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/other-skip-image-downsamplers.json"><span data-i18n="other"></span> - <span data-i18n="imports_skip_image_downsamplers"></span></rule-import-input>
                        </ul>
                    </details>
                    <details>
                        <summary data-i18n="specific"></summary>
                        <ul>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-amazon.json"><span data-i18n="privacy"></span> - Amazon</rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-bing.json"><span data-i18n="privacy"></span> - Bing</rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-duckduckgo.json"><span data-i18n="privacy"></span> - DuckDuckGo</rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-facebook.json"><span data-i18n="privacy"></span> - Facebook</rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-google.json"><span data-i18n="privacy"></span> - Google</rule-import-input>
                            <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-youtube.json"><span data-i18n="privacy"></span> - YouTube</rule-import-input>
                        </ul>
                    </details>
                    <button id="importSelected" class="btn primary" disabled data-i18n="import_selected"></button>
                </div>
                <div id="tab-manual" class="tab-pane">
                    <div id="contents" class="toc sticky"></div>
                    <div id="manual" class="manual-content"></div>
                </div>
            </div>
        </div>
        <template id="alert-popup">
            <modal-dialog>
                <link rel="stylesheet" href="/lib/lit/lit.css" />
                <link rel="stylesheet" href="common.css" />
                <link rel="stylesheet" href="modal-dialog.css" />
                <link rel="stylesheet" href="alert-popup.css" />
                <div class="content">
                    <div class="header"><strong data-i18n="error"></strong></div>
                    <pre id="message"></pre>
                    <div class="footer"><button id="close" class="btn primary" data-i18n="close"></button></div>
                </div>
            </modal-dialog>
        </template>
        <template id="rule-tester">
            <modal-dialog>
                <link rel="stylesheet" href="/lib/lit/lit.css" />
                <link rel="stylesheet" href="common.css" />
                <link rel="stylesheet" href="modal-dialog.css" />
                <link rel="stylesheet" href="rule-tester.css" />
                <div class="content">
                    <div class="header"><strong data-i18n="test_rule"></strong></div>
                    <div class="body">
                        <form id="test-form">
                            <input id="test-url" type="url" class="card w-100" placeholder="https://example.com/" required />
                            <button class="btn primary" type="submit" data-i18n="test"></button>
                        </form>
                        <div id="test-results"></div>
                    </div>
                    <div class="footer"><button id="close" class="btn" data-i18n="close"></button></div>
                </div>
            </modal-dialog>
        </template>
        <template id="rule-input">
            <div id="header" class="rule-header">
                <label class="rule-select">
                    <input id="select" type="checkbox" autocomplete="off" />
                </label>
                <div class="rule-header-title">
                    <div>
                        <small class="badge edit-label d-none" data-i18n="name"></small>
                        <span id="title" class="title"></span>
                    </div>
                    <div class="description-wrap d-none">
                        <small class="badge edit-label d-none" data-i18n="description"></small>
                        <small id="description" class="description"></small>
                    </div>
                    <div class="tag-wrap d-none">
                        <small class="badge edit-label d-none" data-i18n="tag"></small>
                        <button id="add-tag" type="button" class="badge add-tag" data-i18n="set_tag"></button>
                        <small id="tag" class="tag"></small>
                    </div>
                    <div class="group-wrap d-none">
                        <small class="badge edit-label d-none" data-i18n="group"></small>
                        <input id="group" class="group-input" type="text" autocomplete="off" data-i18n-placeholder="group_placeholder" />
                    </div>
                </div>
                <div class="header-info-wrap">
                    <div class="information">
                        <label id="source-badge-wrap" class="badge badge-info d-none">
                            <span id="source-badge"></span>
                        </label>
                        <label id="group-badge-wrap" class="badge badge-success d-none">
                            <span id="group-badge"></span>
                        </label>
                        <label class="badge badge-light">
                            <span id="tag-badge" class="tag-badge"></span>
                        </label>
                        <label class="badge badge-origin" class="d-none">
                            <span id="origin-badge"></span>
                        </label>
                        <label class="badge badge-info">
                            <span id="types-badge" class="count-types"></span>
                        </label>
                        <label class="badge badge-dark">
                            <span id="patterns-badge" class="count-patterns"></span>
                        </label>
                    </div>
                    <div class="rule-header-buttons">
                        <button class="btn btn-edit toggle-edit" data-i18n="edit"></button>
                        <button id="activate" class="btn btn-activate" data-i18n="disable"></button>
                    </div>
                </div>
            </div>
            <div id="input-area" class="d-none">
                <form id="form" class="rule-input c">
                    <small class="form-header" data-i18n="pattern"></small>
                    <div class="row">
                        <div class="form-wrap">
                            <div id="url-area" class="url-wrap">
                                <div class="form-group-pattern">
                                    <select id="scheme" class="scheme" autocomplete="off">
                                        <option value="*">http/https</option>
                                        <option value="http">http</option>
                                        <option value="https">https</option>
                                        <option value="ws">ws</option>
                                        <option value="wss">wss</option>
                                    </select>
                                    <span>://</span>
                                    <input
                                        id="host"
                                        is="tags-input"
                                        type="text"
                                        data-separator=""
                                        data-edit-only="true"
                                        autocomplete="off"
                                        spellcheck="false"
                                        data-i18n-placeholder="placeholder_host"
                                        required
                                    />
                                    <span>/</span>
                                    <input
                                        id="path"
                                        is="tags-input"
                                        type="text"
                                        data-separator=""
                                        data-edit-only="true"
                                        autocomplete="off"
                                        spellcheck="false"
                                        data-i18n-placeholder="placeholder_path"
                                        required
                                    />
                                </div>
                                <div id="tlds-form" class="d-none">
                                    <a id="collapse-tlds" class="collapse-button" data-i18n="top_level_domains"></a>
                                    <div id="tlds-area" class="d-none">
                                        <div class="form-wrap">
                                            <div>
                                                <input
                                                    id="tlds"
                                                    is="tags-input"
                                                    type="text"
                                                    data-separator=""
                                                    data-edit-only="true"
                                                    autocomplete="off"
                                                    spellcheck="false"
                                                    data-i18n-placeholder="placeholder_tlds"
                                                />
                                            </div>
                                            <div class="any-wrap">
                                                <label class="btn">
                                                    <input id="any-tld" type="checkbox" autocomplete="off" />
                                                    <span data-i18n="any_tld"></span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="any-wrap">
                                <label class="btn">
                                    <input id="any-url" type="checkbox" autocomplete="off" />
                                    <span data-i18n="any_url"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <a id="collapse-matchers" class="collapse-button" data-i18n="extra_matchers"></a>
                    <div id="matchers" class="d-none">
                        <div class="row">
                            <label data-i18n="http_method"></label>
                            <input id="method" is="tags-input" type="text" data-separator="" data-edit-only="true" autocomplete="off" spellcheck="false" />
                        </div>
                        <div class="row">
                            <label data-i18n="extra_url_matcher"></label>
                            <input id="includes" is="tags-input" type="text" data-separator="" data-edit-only="true" autocomplete="off" spellcheck="false" />
                        </div>
                        <div class="row">
                            <label data-i18n="extra_url_exclude"></label>
                            <input id="excludes" is="tags-input" type="text" data-separator="" data-edit-only="true" autocomplete="off" spellcheck="false" />
                        </div>
                        <div class="row">
                            <label data-i18n="origin"></label>
                            <select id="origin" autocomplete="off">
                                <option value="any" data-i18n="any"></option>
                                <option value="same-domain" data-i18n="same_domain"></option>
                                <option value="same-origin" data-i18n="same_origin"></option>
                                <option value="third-party-domain" data-i18n="third_party_domain"></option>
                                <option value="third-party-origin" data-i18n="third_party_origin"></option>
                            </select>
                        </div>
                        <div class="row">
                            <label data-i18n="private_browsing"></label>
                            <select id="incognito" autocomplete="off">
                                <option value="" data-i18n="any"></option>
                                <option value="true" data-i18n="only_private"></option>
                                <option value="false" data-i18n="not_private"></option>
                            </select>
                        </div>
                    </div>
                    <small class="form-header" data-i18n="types"></small>
                    <div class="row">
                        <div class="form-wrap">
                            <div id="types" class="types-wrap">
                                <label class="btn"><input class="type" type="checkbox" value="main_frame" /><span data-i18n="main_frame"></span></label>
                                <label class="btn"><input class="type" type="checkbox" value="sub_frame" /><span data-i18n="sub_frame"></span></label>
                                <label class="btn"><input class="type" type="checkbox" value="stylesheet" /><span data-i18n="stylesheet"></span></label>
                                <label class="btn"><input class="type" type="checkbox" value="script" /><span data-i18n="script"></span></label>
                                <label class="btn"><input class="type" type="checkbox" value="image" /><span data-i18n="image"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="object" /><span data-i18n="object"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="xmlhttprequest" /><span data-i18n="xmlhttprequest"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="xml_dtd" /><span data-i18n="xml_dtd"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="font" /><span data-i18n="font"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="media" /><span data-i18n="media"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="websocket" /><span data-i18n="websocket"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="csp_report" /><span data-i18n="csp_report"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="imageset" /><span data-i18n="imageset"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="other" /><span data-i18n="other"></span></label>
                                <label class="btn"><input class="type extra-type" type="checkbox" value="speculative" /><span data-i18n="speculative"></span></label>
                                <label class="btn">
                                    <input id="more-types" class="v-hidden" type="checkbox" autocomplete="off" />
                                    <span class="text" data-i18n="show_more_true"></span>
                                </label>
                            </div>
                            <div class="any-wrap">
                                <label class="btn">
                                    <input id="any-type" type="checkbox" autocomplete="off" />
                                    <span data-i18n="any_type"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <small class="form-header" data-i18n="action"></small>
                    <div class="row">
                        <select id="action" autocomplete="off" required>
                            <option hidden selected value></option>
                            <option value="filter" data-i18n="filter"></option>
                            <option value="redirect" data-i18n="redirect"></option>
                            <option value="secure" data-i18n="secure"></option>
                            <option value="block" data-i18n="block"></option>
                            <option value="whitelist" data-i18n="whitelist"></option>
                        </select>
                    </div>
                </form>
                <div class="row rule-input-buttons">
                    <button class="btn primary btn-done toggle-edit" data-i18n="done"></button>
                    <button id="create" class="btn primary btn-create" data-i18n="create"></button>
                    <button id="delete" class="btn btn-danger btn-delete">
                        <img src="/icons/ionicons/trash-bin.svg" width="16" />
                        <span data-i18n="delete"></span>
                    </button>
                </div>
            </div>
        </template>
        <template id="actions-redirect">
            <div class="row">
                <div>
                    <input
                        id="redirect-url"
                        type="text"
                        class="redirectUrl card w-100"
                        spellcheck="false"
                        data-i18n-placeholder="redirect_url"
                    />
                </div>
                <div>
                    <small>
                        <span data-i18n="manual_text_redirect"></span>
                        <a href="#tab-manual#redirect-using-pattern-capturing" data-i18n="see_manual"></a>
                    </small>
                </div>
                <div>
                    <label class="btn">
                        <input id="redirect-document" type="checkbox" />
                        <span data-i18n="redirect_document_with_other_types"></span>
                    </label>
                </div>
            </div>
        </template>
        <template id="actions-filter">
            <div class="row">
                <div>
                    <label class="btn">
                        <input id="filter-redirection" type="checkbox" checked="checked" />
                        <span data-i18n="filter_url_redirection"></span>
                    </label>
                    <label class="btn">
                        <input id="skip-same-domain" type="checkbox" />
                        <span data-i18n="skip_within_same_domain"></span>
                    </label>
                    <label class="btn">
                        <input id="redirect-document" type="checkbox" />
                        <span data-i18n="redirect_document_with_other_types"></span>
                    </label>
                </div>
                <div>
                    <div class="form-wrap">
                        <div id="trim-parameters" class="col-trim-parameters">
                            <input
                                id="input-params"
                                is="tags-input"
                                type="text"
                                data-separator=""
                                data-edit-only="true"
                                autocomplete="off"
                                spellcheck="false"
                                data-i18n-placeholder="placeholder_trim_parameters"
                            />
                            <label class="btn">
                                <input id="invert-trim" type="checkbox" autocomplete="off" />
                                <span data-i18n="invert_trim"></span>
                            </label>
                        </div>
                        <div class="any-wrap">
                            <label class="btn">
                                <input id="trim-all-params" type="checkbox" autocomplete="off" />
                                <span data-i18n="trim_all"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </template>
        <template id="actions-whitelist">
            <div class="row">
                <div>
                    <label class="btn">
                        <input id="log-whitelist" type="checkbox" />
                        <span data-i18n="log_whitelisted_requests"></span>
                    </label>
                </div>
            </div>
        </template>
        <template id="rule-list">
            <div class="container">
                <div class="header">
                    <input id="select-all" class="select-all" type="checkbox" autocomplete="off" />
                    <img id="icon" alt="" height="16" />
                    <span id="title"></span>
                    <small id="selected-text" class="d-none"></small>
                    <a id="collapse" class="collapse-button"></a>
                </div>
                <ul id="list" class="list"></ul>
            </div>
        </template>
        <template id="rule-import-input">
            <link rel="stylesheet" href="/lib/lit/lit.css" />
            <link rel="stylesheet" href="../util/badges.css" />
            <link rel="stylesheet" href="common.css" />
            <link rel="stylesheet" href="rule-import-input.css" />
            <li>
                <button id="import" class="btn text" data-i18n-title="import_list" hidden><img src="/icons/ionicons/download-outline.svg" height="20" class="middle"/></button>
                <button id="delete-imported" class="btn text" data-i18n-title="delete_imported_rules" hidden><img src="/icons/ionicons/trash-bin-outline.svg" height="20" class="middle"/></button>
                <label>
                    <slot id="name"></slot>
                </label>
                <a id="url" target="_blank" data-i18n-title="view_list"><img src="/icons/ionicons/open-outline.svg" height="20" class="middle"></a>
                <loading-dots id="loading"></loading-dots>
                <img id="error" src="/icons/ionicons/warning-outline.svg" height="20" class="middle" hidden/>
                <span id="count" class="badge badge-info"></span>
                <span id="imported" class="badge badge-success" data-i18n="imported" hidden></span>
                <span id="update" class="badge badge-notify" data-i18n="update" hidden></span>
                <button id="show-imported" class="btn text" data-i18n-title="show_imported_rules" hidden><img src="/icons/ionicons/list-outline.svg" height="20" class="middle"/></button>
                <button id="delete" class="btn text" data-i18n-title="remove_list" hidden><img src="/icons/ionicons/close-circle-outline.svg" height="20" class="middle"/></button>
            </li>
        </template>
    </body>
</html>
