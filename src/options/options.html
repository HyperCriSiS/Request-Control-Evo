<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Request Control</title>
        <link rel="stylesheet" href="/lib/lit/lit.css" />
        <link rel="stylesheet" href="common.css" />
        <link rel="stylesheet" href="options.css" />
        <link rel="stylesheet" href="modal-dialog.css" />
        <link rel="stylesheet" href="loading-dots.css" />
        <link rel="stylesheet" href="rule-input.css" />
        <link rel="stylesheet" href="rule-list.css" />
        <link rel="stylesheet" href="rule-import-input.css" />
        <link rel="stylesheet" href="rule-tester.css" />
        <link rel="stylesheet" href="alert-popup.css" />
    </head>
    <body>
        <main>
            <header>
                <img class="app-icon" src="/icons/icon.svg" width="48" height="48" />
                <div>
                    <h1 data-i18n="extension_name"></h1>
                    <div class="version"></div>
                </div>
            </header>
            <nav class="tabs">
                <button data-tab="tab-rules" class="active" data-i18n="rules"></button>
                <button data-tab="tab-imports" data-i18n="imports"></button>
                <button data-tab="tab-settings" data-i18n="settings"></button>
                <button data-tab="tab-about" data-i18n="about"></button>
            </nav>
            <div id="tab-rules" class="tab-pane active">
                <div class="rules-toolbar">
                    <button id="addRule" class="btn btn-primary">
                        <img src="/icons/ionicons/add.svg" width="16" />
                        <span data-i18n="add_rule"></span>
                    </button>
                    <button id="testRules" class="btn">
                        <img src="/icons/ionicons/flask.svg" width="16" />
                        <span data-i18n="test_rules"></span>
                    </button>
                    <button id="analyzeUrl" class="btn">
                        <img src="/icons/ionicons/search.svg" width="16" />
                        <span data-i18n="analyzer"></span>
                    </button>
                    <div class="toolbar-spacer"></div>
                    <label class="search-input">
                        <img src="/icons/ionicons/search.svg" width="16" />
                        <input id="searchRules" type="search" data-i18n-placeholder="search_rules" />
                    </label>
                </div>
                <div id="ruleSuggestions" class="rule-suggestions d-none">
                    <div class="rule-suggestions-header">
                        <div>
                            <h3 data-i18n="analyzer_title"></h3>
                            <p data-i18n="analyzer_description"></p>
                        </div>
                        <button id="closeRuleSuggestions" class="btn btn-icon" aria-label="Close">×</button>
                    </div>
                    <div class="rule-suggestions-form">
                        <label>
                            <span data-i18n="analyzer_url_label"></span>
                            <input id="analyzerUrl" type="url" data-i18n-placeholder="analyzer_url_placeholder" />
                        </label>
                        <button id="runRuleSuggestions" class="btn btn-primary" data-i18n="analyze"></button>
                    </div>
                    <p class="rule-suggestions-privacy" data-i18n="analyzer_privacy_note"></p>
                    <div id="ruleSuggestionsStatus" class="rule-suggestions-status"></div>
                    <div id="ruleSuggestionsContent"></div>
                </div>
                <rule-list id="ruleList"></rule-list>
                <div class="selection-toolbar d-none">
                    <div class="selection-toolbar-actions">
                        <button
                            id="enableSelectedRules"
                            class="btn btn-selected-action"
                            disabled="disabled"
                            autocomplete="off"
                        >
                            <img src="/icons/ionicons/checkmark-circle.svg" width="16" />
                            <span data-i18n="enable_selected"></span>
                            <span class="badge badge-light selected-count">0</span>
                        </button>
                        <button
                            id="disableSelectedRules"
                            class="btn btn-selected-action"
                            disabled="disabled"
                            autocomplete="off"
                        >
                            <img src="/icons/ionicons/pause-circle.svg" width="16" />
                            <span data-i18n="disable_selected"></span>
                            <span class="badge badge-light selected-count">0</span>
                        </button>
                        <button
                            id="removeSelectedRules"
                            class="btn btn-danger btn-selected-action"
                            disabled="disabled"
                            autocomplete="off"
                        >
                            <img src="/icons/ionicons/trash-bin.svg" width="16" />
                            <span data-i18n="remove_selected"></span>
                            <span class="badge badge-light selected-count">0</span>
                        </button>
                    </div>
                    <button id="selectedRules" class="btn" data-i18n="zero_selected_rules"></button>
                </div>
            </div>
            <div id="tab-imports" class="tab-pane">
                <details open>
                    <summary data-i18n="common_lists"></summary>
                    <ul>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-common-redirectors.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_skip_redirectors"></span></rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-common-params.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_remove_parameters"></span></rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-common-images.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_remove_image_parameters"></span></rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-block-beacon-and-ping.json"><span data-i18n="privacy"></span> - <span data-i18n="imports_block_beacon_and_ping"></span></rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/other-skip-image-downsamplers.json"><span data-i18n="other"></span> - <span data-i18n="imports_skip_image_downsamplers"></span></rule-import-input>
                    </ul>
                </details>
                <details open>
                    <summary data-i18n="special_lists"></summary>
                    <ul>
                        <rule-import-input src="/rules/media-original-quality.json"><span data-i18n="imports_original_media"></span></rule-import-input>
                        <rule-import-input src="/rules/privacy-enhanced-embeds.json"><span data-i18n="imports_privacy_enhanced_embeds"></span></rule-import-input>
                        <rule-import-input src="/rules/developer-direct-raw.json"><span data-i18n="imports_developer_direct_raw"></span></rule-import-input>
                        <rule-import-input src="/rules/search-engine-escape.json"><span data-i18n="imports_search_engine_escape"></span></rule-import-input>
                        <rule-import-input src="/rules/privacy-aggressive-direct-links.json"><span data-i18n="imports_aggressive_direct_links"></span></rule-import-input>
                        <rule-import-input src="/rules/web-canonical-desktop.json"><span data-i18n="imports_canonical_desktop"></span></rule-import-input>
                        <rule-import-input src="/rules/special-text-first-low-bandwidth.json"><span data-i18n="imports_text_first_low_bandwidth"></span></rule-import-input>
                        <rule-import-input src="/rules/special-first-party-firewall.json"><span data-i18n="imports_first_party_firewall"></span></rule-import-input>
                    </ul>
                </details>
                <details open>
                    <summary data-i18n="site_specific_lists"></summary>
                    <ul>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-amazon.json"><span data-i18n="privacy"></span> - Amazon</rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-bing.json"><span data-i18n="privacy"></span> - Bing</rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-duckduckgo.json"><span data-i18n="privacy"></span> - DuckDuckGo</rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-facebook.json"><span data-i18n="privacy"></span> - Facebook</rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-google.json"><span data-i18n="privacy"></span> - Google</rule-import-input>
                        <rule-import-input src="https://tumpio.github.io/requestcontrol/rules/privacy-youtube.json"><span data-i18n="privacy"></span> - YouTube</rule-import-input>
                    </ul>
                </details>
                <details open>
                    <summary data-i18n="my_lists"></summary>
                    <ul id="my-import-sources"></ul>
                    <form id="import-source-form">
                        <input id="new-import-source" name="src" required type="url" data-i18n-placeholder="add_url_to_rules"></input>
                        <button class="btn">
                            <span data-i18n="add"></span>
                        </button>
                    </form>
                </details>
            </div>
            <div id="tab-settings" class="tab-pane">
                <h4 data-i18n="export_rules"></h4>
                <p data-i18n="export_description"></p>
                <button id="exportRules" class="btn btn-dark" data-i18n="export"></button>
                <hr />
                <h4 data-i18n="import_rules"></h4>
                <p data-i18n="import_description"></p>
                <label class="btn btn-dark" for="importRules">
                    <input
                        id="importRules"
                        class="d-none"
                        type="file"
                        accept="application/json,.json,text/plain,.txt"
                        autocomplete="off"
                    />
                    <span data-i18n="browse_file"></span>
                </label>
                <hr />
                <h4 data-i18n="options"></h4>
                <label class="form-check">
                    <input id="setting-enabled" type="checkbox" />
                    <span data-i18n="enable_rules"></span>
                </label>
                <label class="form-check">
                    <input id="setting-show-request-counter" type="checkbox" />
                    <span data-i18n="option_show_request_counter"></span>
                </label>
                <label class="form-check">
                    <input id="setting-change-toolbar-icon" type="checkbox" />
                    <span data-i18n="option_change_toolbar_icon"></span>
                </label>
            </div>
            <div id="tab-about" class="tab-pane">
                <h4 data-i18n="about"></h4>
                <p data-i18n="about_description"></p>
                <dl>
                    <dt data-i18n="version"></dt>
                    <dd class="version"></dd>
                    <dt data-i18n="source_code"></dt>
                    <dd><a href="https://github.com/HyperCriSiS/Request-Control-Evo">GitHub</a></dd>
                    <dt data-i18n="license"></dt>
                    <dd><a href="https://www.mozilla.org/MPL/2.0/">Mozilla Public License 2.0</a></dd>
                </dl>
            </div>
        </main>
        <modal-dialog id="ruleModal">
            <rule-input></rule-input>
        </modal-dialog>
        <modal-dialog id="ruleTesterModal">
            <rule-tester></rule-tester>
        </modal-dialog>
        <alert-popup></alert-popup>
        <script type="module" src="options.js"></script>
    </body>
</html>
