<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Control — URL Analyzer</title>
  <link rel="stylesheet" href="analyzer.css">
  <script defer type="module" src="../util/i18n.js"></script>
  <script defer type="module" src="analyzer.js"></script>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 data-i18n="analyzer_title"></h1>
        <p data-i18n="analyzer_privacy_note"></p>
      </div>
      <button id="open-options" type="button" data-i18n="rules"></button>
    </header>

    <section class="card" id="guardian-card">
      <h2 data-i18n="guardian_title"></h2>
      <p class="muted" data-i18n="guardian_on_demand_note"></p>
      <div class="actions row-actions">
        <button id="guardian-run" class="primary" type="button" data-i18n="guardian_run"></button>
        <span id="guardian-status" class="muted"></span>
      </div>
      <div id="guardian-result" class="hidden">
        <dl>
          <div><dt data-i18n="guardian_score"></dt><dd id="guardian-score"></dd></div>
          <div><dt data-i18n="guardian_request_errors"></dt><dd id="guardian-errors"></dd></div>
          <div><dt data-i18n="guardian_http_failures"></dt><dd id="guardian-http"></dd></div>
        </dl>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="referrer_title"></h2>
      <p class="muted" data-i18n="referrer_note"></p>
      <label for="referrer-mode" data-i18n="referrer_mode"></label>
      <select id="referrer-mode">
        <option value="browser" data-i18n="referrer_browser"></option>
        <option value="balanced" data-i18n="referrer_balanced"></option>
        <option value="same-origin" data-i18n="referrer_same_origin"></option>
        <option value="no-referrer" data-i18n="referrer_none"></option>
      </select>
    </section>

    <section class="card">
      <form id="analyzer-form">
        <label for="url" data-i18n="analyzer_url_label"></label>
        <div class="input-row">
          <input id="url" type="url" required autocomplete="off" spellcheck="false" data-i18n-placeholder="analyzer_url_placeholder">
          <button type="submit" class="primary" data-i18n="analyze"></button>
        </div>
      </form>
      <p id="error" class="error hidden" data-i18n="analyzer_invalid_url"></p>
    </section>

    <section id="results" class="card hidden">
      <dl>
        <div><dt data-i18n="host"></dt><dd id="host"></dd></div>
        <div><dt data-i18n="path"></dt><dd id="path"></dd></div>
        <div><dt data-i18n="analyzer_query_parameters"></dt><dd id="parameter-count"></dd></div>
      </dl>

      <h2 data-i18n="analyzer_suggestions"></h2>
      <div id="suggestions"></div>
      <p id="no-suggestions" class="muted hidden" data-i18n="analyzer_no_suggestions"></p>
      <div class="actions">
        <button id="create-rule" class="primary" type="button" data-i18n="analyzer_create_rule" disabled></button>
      </div>
      <p class="muted" data-i18n="analyzer_rule_disabled_note"></p>
    </section>
  </main>
</body>
</html>
