name: Repair compiler ASCII checks

on:
  push:
    branches:
      - feature/mv3-compiler
    paths:
      - .github/workflows/capture-eslint.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mv3-compiler
      - name: Replace control-character regex checks
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/main/backends/dnr/compiler.js')
          text = path.read_text()
          marker = '''function escapeRegex(value) {\n    return value.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");\n}\n'''
          helper = marker + '''\nfunction isAscii(value) {\n    for (const char of value) {\n        if (char.codePointAt(0) > 0x7f) {\n            return false;\n        }\n    }\n    return true;\n}\n'''
          if marker not in text:
              raise SystemExit('escapeRegex marker not found')
          text = text.replace(marker, helper, 1)
          text = text.replace('/[^\\x00-\\x7F]/.test(tld)', '!isAscii(tld)')
          text = text.replace('/[^\\x00-\\x7F]/.test(host)', '!isAscii(host)')
          text = text.replace('/[^\\x00-\\x7F]/.test(path)', '!isAscii(path)')
          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/backends/dnr/compiler.js
          git commit -m "fix: avoid control-character regexes in DNR compiler"
          git push origin HEAD:feature/mv3-compiler
