name: automation inspect next dnr parity
on:
  push:
    paths:
      - '.github/workflows/automation-inspect-next-dnr-parity.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Inspect compiler and parity coverage
        run: |
          echo '=== compiler ==='
          sed -n '1,320p' src/background/dnr/compiler.js 2>/dev/null || find . -path '*dnr*compiler*' -type f -maxdepth 6 -print -exec sed -n '1,320p' {} \;
          echo '=== parity tests ==='
          ls test/*dnr* 2>/dev/null || true
          for f in test/*dnr*parity*.test.js; do echo "=== $f ==="; sed -n '1,260p' "$f"; done
      - name: Remove helper
        run: |
          rm -f .github/workflows/automation-inspect-next-dnr-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove temporary DNR parity probe' || exit 0
          git push origin HEAD:dev
