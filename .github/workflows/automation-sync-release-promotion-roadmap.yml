name: Sync 1.17.0 promotion roadmap

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-sync-release-promotion-roadmap.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Record completed release promotion
        shell: python
        run: |
          from pathlib import Path

          path = Path("ROADMAP.md")
          text = path.read_text(encoding="utf-8")

          old_task = "- [ ] Promote the validated 1.17.0 release candidate to `master` through the established release workflow."
          new_task = "- [x] Promote the validated 1.17.0 release candidate to `master` through the established release workflow."
          if old_task not in text:
              raise SystemExit("Expected open promotion task not found")
          text = text.replace(old_task, new_task, 1)

          old_status = "Promotion remains open until the PR checks complete successfully."
          new_status = "PR #18 merged successfully to `master` as `959e6f6e`; the release workflow is now running and release artifact verification remains open."
          if old_status not in text:
              raise SystemExit("Expected promotion status sentence not found")
          text = text.replace(old_status, new_status, 1)

          old_remaining = "Remaining work is successful PR validation/promotion and verification of the release workflow/tag/artifact."
          new_remaining = "Remaining work is verification of the release workflow/tag/artifact."
          if old_remaining in text:
              text = text.replace(old_remaining, new_remaining, 1)

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow and commit roadmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automation-sync-release-promotion-roadmap.yml
          git add ROADMAP.md
          git commit -m "docs: record successful 1.17.0 promotion"
          git push origin HEAD:dev
