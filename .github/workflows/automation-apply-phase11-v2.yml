name: Apply Phase 11 on current dev

on:
  push:
    branches:
      - feature/imports-assistant-redirects-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/imports-assistant-redirects-v2
          fetch-depth: 1
      - name: Apply validated patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin feature/imports-assistant-redirects
          for n in 00 01 02 03; do
            git show origin/feature/imports-assistant-redirects:.phase11-patch-$n > /tmp/p$n
          done
          sed -i 's/7rllZWVlZWV\/+e1txnXpllAj/7rllZWVlZWV\/+e1TxnXpllAj/' /tmp/p01
          sed -i 's/t4vy4hbHdCiFSfxcrowRJf/t4vy4hbHdCiFSfxCrowRJf/' /tmp/p03
          test "$(git hash-object /tmp/p00)" = "6d75dd28e830054a09cc1616d55b5b2abcab9d69"
          test "$(git hash-object /tmp/p01)" = "60776d6b33310819f0800c07458b8b5be8a1b6c5"
          test "$(git hash-object /tmp/p02)" = "7085bb46c44eea0ad2ef3547294cb3c64d397920"
          test "$(git hash-object /tmp/p03)" = "7d66d6038b14b4c9df3468c643365cfe4d7f6e89"
          cat /tmp/p00 /tmp/p01 /tmp/p02 /tmp/p03 | base64 -d | gzip -d > /tmp/phase11.patch
          patch -p1 --forward --batch < /tmp/phase11.patch
          rm .github/workflows/automation-apply-phase11-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Phase 11 imports, Rule Coach and safe redirects"
          git push
