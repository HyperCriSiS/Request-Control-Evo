name: Finalize repository hygiene

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Remove merged legacy branches and record consolidation
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          DELETED_FILE=$(mktemp)
          KEPT_FILE=$(mktemp)

          while IFS= read -r REMOTE_REF; do
            BRANCH=${REMOTE_REF#refs/remotes/origin/}
            case "$BRANCH" in
              master|HEAD|dependabot/*)
                continue
                ;;
            esac

            if git merge-base --is-ancestor "$REMOTE_REF" origin/master; then
              echo "$BRANCH" >> "$DELETED_FILE"
              git push origin --delete "$BRANCH"
            else
              echo "$BRANCH" >> "$KEPT_FILE"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/ | sort)

          python <<'PY'
          from pathlib import Path

          path = Path("ROADMAP.md")
          text = path.read_text()

          old_status = "**Status: `1.20.0-rc.7` is the current corrected hands-on candidate after the RC6 feedback block. Automated release/security gates are green; stable 1.20.0 remains blocked on Firefox/Waterfox desktop and Firefox Android hands-on validation plus explicit user approval.**"
          new_status = "**Status: `1.20.0-rc.7` is the current corrected hands-on candidate after the RC6 feedback block, and `master` now contains the validated 1.20 integration state. Automated release/security gates are green; stable 1.20.0 remains blocked on Firefox/Waterfox desktop and Firefox Android hands-on validation plus explicit user approval.**"
          if old_status not in text:
              raise SystemExit("Expected ROADMAP status line not found")
          text = text.replace(old_status, new_status, 1)

          anchor = "- [x] Decouple repository integration from publication: `master` is the sole long-lived integration branch; merging validated RC code to `master` does **not** publish Stable.\n"
          addition = (
              anchor
              + "- [x] Consolidate the validated 1.20 RC integration history onto `master` via PR #62; post-consolidation Build #482 is green on `e0ba40c2657cfbe64738771aafaf9f6b1ce002d6`.\n"
              + "- [x] Remove fully merged legacy branch refs after consolidation while preserving active Dependabot and any branch with commits not reachable from `master`.\n"
          )
          if anchor not in text:
              raise SystemExit("Expected ROADMAP consolidation anchor not found")
          text = text.replace(anchor, addition, 1)
          path.write_text(text)
          PY

          git rm .github/workflows/finalize-repository-hygiene.yml
          git add ROADMAP.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record master consolidation and repository cleanup"
          git push origin HEAD:master

          {
            echo "## Repository hygiene"
            echo
            echo "### Deleted merged branches"
            if [[ -s "$DELETED_FILE" ]]; then
              sed 's/^/- `/' "$DELETED_FILE" | sed 's/$/`/'
            else
              echo "- None"
            fi
            echo
            echo "### Preserved unmerged branches"
            if [[ -s "$KEPT_FILE" ]]; then
              sed 's/^/- `/' "$KEPT_FILE" | sed 's/$/`/'
            else
              echo "- None"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
