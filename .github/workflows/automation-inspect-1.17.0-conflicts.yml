name: Resolve 1.17.0 release metadata conflicts

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-inspect-1.17.0-conflicts.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: release/1.17.0
          fetch-depth: 0
      - name: Merge master and resolve release metadata only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          set +e
          git merge --no-commit --no-ff origin/master
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git commit -m "chore: synchronize 1.17.0 release with master" || true
            git push origin HEAD:release/1.17.0
            exit 0
          fi
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=(CHANGELOG.md manifest.json)
          if [ "${conflicts[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected conflicts: %s\n' "${conflicts[*]}"
            git merge --abort || true
            exit 1
          fi
          git checkout --ours CHANGELOG.md manifest.json
          git add CHANGELOG.md manifest.json
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain"
            exit 1
          fi
          grep -q '"version": "1.17.0"' manifest.json
          grep -q '^## \[1.17.0\] - Aug. 18, 2026$' CHANGELOG.md
          git commit -m "chore: synchronize 1.17.0 release with master"
          git push origin HEAD:release/1.17.0
