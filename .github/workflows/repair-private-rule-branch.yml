name: Repair private rule branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/private-rule-semantics
          fetch-depth: 0
      - name: Restore and patch branch files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout origin/master -- src/options/rule-input.js
          python <<'PY'
          from pathlib import Path

          rule_input = Path('src/options/rule-input.js')
          text = rule_input.read_text()
          text = text.replace(
              'import { decodeLegacyMetadata } from "./legacy-metadata.js";\n',
              'import { decodeLegacyMetadata } from "./legacy-metadata.js";\nimport { privateWindowEditorValue } from "./rule-editor-state.js";\n',
              1,
          )
          old = '''        if (this.rule.pattern.incognito) {\n            this.querySelector("#incognito").value = this.rule.pattern.incognito.toString();\n        }\n'''
          new = '''        this.querySelector("#incognito").value = privateWindowEditorValue(this.rule.pattern);\n'''
          if old not in text:
              raise SystemExit('Expected incognito editor block not found')
          rule_input.write_text(text.replace(old, new, 1))

          Path('src/options/rule-editor-state.js').write_text('''/* This Source Code Form is subject to the terms of the Mozilla Public\n * License, v. 2.0. If a copy of the MPL was not distributed with this\n * file, You can obtain one at http://mozilla.org/MPL/2.0/. */\n\nexport function privateWindowEditorValue(pattern = {}) {\n    return typeof pattern.incognito === "boolean" ? pattern.incognito.toString() : "";\n}\n''')

          Path('test/private-rule-semantics.test.js').write_text('''import { privateWindowEditorValue } from "../src/options/rule-editor-state.js";\n\ntest("private-window-only rules remain explicitly selected", () => {\n    expect(privateWindowEditorValue({ incognito: true })).toBe("true");\n});\n\ntest("normal-window-only rules preserve explicit private-window exclusion", () => {\n    expect(privateWindowEditorValue({ incognito: false })).toBe("false");\n});\n\ntest("rules without a private-window constraint reset the editor to both contexts", () => {\n    expect(privateWindowEditorValue({})).toBe("");\n    expect(privateWindowEditorValue()).toBe("");\n});\n''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/options/rule-input.js src/options/rule-editor-state.js test/private-rule-semantics.test.js
          git commit -m "Repair private-window rule semantics branch"
          git push origin HEAD:fix/private-rule-semantics
