name: Repair release candidate

on:
  push:
    branches:
      - feature/modernization
    paths:
      - .github/workflows/repair-release-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/modernization
          fetch-depth: 0
      - name: Restore verified baselines and apply release-only changes
        run: |
          git fetch origin master
          git checkout origin/master -- src/options/options.html CHANGELOG.md
          git checkout a5e63e9a888994bd46ffa4228886a2887f809dcc -- \
            src/options/rule-input.js \
            src/options/rule-grouping.js \
            test/rule-grouping.test.js \
            package.json \
            manifest.json
          python <<'PY'
          from pathlib import Path

          options = Path('src/options/options.html')
          text = options.read_text()
          text = text.replace('https://github.com/tumpio/requestcontrol/graphs/contributors', 'https://github.com/HyperCriSiS/requestcontrol/graphs/contributors')
          text = text.replace('https://github.com/tumpio/requestcontrol/issues', 'https://github.com/HyperCriSiS/requestcontrol/issues')
          text = text.replace('https://github.com/tumpio/requestcontrol', 'https://github.com/HyperCriSiS/requestcontrol')
          tag = '''                    <div class="tag-wrap d-none">\n                        <small class="badge edit-label d-none" data-i18n="tag"></small>\n                        <button id="add-tag" type="button" class="badge add-tag" data-i18n="set_tag"></button>\n                        <small id="tag" class="tag"></small>\n                    </div>\n'''
          group = tag + '''                    <div class="group-wrap d-none">\n                        <small class="badge edit-label d-none" data-i18n="group"></small>\n                        <input\n                            id="group"\n                            class="group-input"\n                            type="text"\n                            autocomplete="off"\n                            data-i18n-placeholder="group_placeholder"\n                        />\n                    </div>\n'''
          if tag not in text:
              raise SystemExit('tag marker missing')
          text = text.replace(tag, group, 1)
          info = '''                    <div class="information">\n                        <label class="badge badge-light">\n'''
          badges = '''                    <div class="information">\n                        <label id="source-badge-wrap" class="badge badge-info d-none">\n                            <span id="source-badge"></span>\n                        </label>\n                        <label id="group-badge-wrap" class="badge badge-success d-none">\n                            <span id="group-badge"></span>\n                        </label>\n                        <label class="badge badge-light">\n'''
          if info not in text:
              raise SystemExit('information marker missing')
          options.write_text(text.replace(info, badges, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          old = '''## [Unreleased]\n- Add option to remove toolbar icon counter. #129\n- Add support for matching hostnames without suffix (TLD wildcard). #126\n- Add private browsing matcher to ignore or only use in private browsing.\n'''
          new = '''## [Unreleased]\n\n## [1.16.0] - Aug. 14, 2026\n- Add option to remove toolbar icon counter. #129\n- Add support for matching hostnames without suffix (TLD wildcard). #126\n- Add private browsing matcher to ignore or only use in private browsing.\n- Add a local URL analyzer for known tracking parameters and embedded destination URLs.\n- Add assisted rule creation with generated rules disabled until reviewed.\n- Add rule groups and managed-source badges without changing request matching semantics.\n- Add conflict-safe managed rule subscriptions with provenance and SHA-256 baselines.\n- Add the Request Control Community catalog with SHA-256 integrity verification for catalog rule files.\n- Modernize the options and popup UI, including dark mode and responsive behavior.\n- Update the Node.js dependency, lint, test, build, Dependabot, and release toolchain.\n- Add upstream issue and pull-request triage plus the browser-backend modernization roadmap.\n'''
          if old not in text:
              raise SystemExit('changelog marker missing')
          changelog.write_text(text.replace(old, new, 1))

          path = Path('src/options/rule-input.js')
          text = path.read_text().replace('return this.rule.group ? decodeURIComponent(this.rule.group) : "";', 'return this.rule.group || "";')
          path.write_text(text)

          path = Path('src/options/rule-grouping.js')
          text = path.read_text().replace('const name = input.rule.group ? decodeURIComponent(input.rule.group) : "";', 'const name = input.rule.group || "";')
          path.write_text(text)

          path = Path('test/rule-grouping.test.js')
          text = path.read_text().replace(
              'test("groupRuleInputs decodes imported group labels", () => {\n    const groups = groupRuleInputs([input("Rule", "Privacy%20%2F%20Tracking")]);\n    expect(groups[0].name).toBe("Privacy / Tracking");\n});',
              'test("groupRuleInputs preserves literal group labels including percent signs", () => {\n    const groups = groupRuleInputs([input("Rule", "100% Privacy")]);\n    expect(groups[0].name).toBe("100% Privacy");\n});'
          )
          path.write_text(text)

          path = Path('package.json')
          text = path.read_text().replace('"lint-build": "addons-linter web-ext-artifacts/', '"lint-build": "addons-linter --warnings-as-errors web-ext-artifacts/')
          path.write_text(text)

          path = Path('manifest.json')
          text = path.read_text().replace('"version": "1.16.0a1"', '"version": "1.16.0"')
          path.write_text(text)
          PY
      - name: Commit repaired candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/options/options.html CHANGELOG.md src/options/rule-input.js src/options/rule-grouping.js test/rule-grouping.test.js package.json manifest.json
          git commit -m "release: finalize 1.16.0 candidate and restore minimal diffs"
          git push origin HEAD:feature/modernization