name: Complete 1.19.0 roadmap

on:
  push:
    branches:
      - docs/complete-1.19.0-roadmap
    paths:
      - .github/workflows/automation-complete-1.19.0-roadmap.yml

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/complete-1.19.0-roadmap
      - name: Record verified release completion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text()
          replacements = {
              '**Status: 1.18.1 released; Phase 10 / 1.19.0 release finalization in progress**': '**Status: 1.19.0 released and verified; Phase 10 complete**',
              '- Request Control 1.18.1 is released from `master` with the bundled showcase rulesets.\n- `dev` is the active development branch and contains the released 1.18.1 baseline plus later validated work.': '- Request Control 1.18.1 is released from `master` with the bundled showcase rulesets.\n- Request Control 1.19.0 is released from `master` with the Compatibility Guardian, Referer protection, source-site/DNR hardening, Firefox Android UI fixes and hardened import-source handling.\n- `dev` is the active development branch and contains the released 1.19.0 baseline.',
              '- [ ] Validate the complete 1.19.0 candidate through audit, lint, tests, build, build-lint/checker and security checks.': '- [x] Validate the complete 1.19.0 candidate through audit, lint, tests, build, build-lint/checker and security checks; PR #46 passed the full project CI and both CodeQL analyses, with zero open code-scanning, Dependabot or secret-scanning alerts at the release gate.',
              '- [ ] Promote the validated candidate to `master` without rewriting the immutable 1.18.x release history.': '- [x] Promote the validated candidate to `master` without rewriting the immutable 1.18.x release history; PR #46 merged as `d2001728b4887d74a244717920de6e4b10827745` from a `master`-based promotion branch whose Git tree matched validated `dev`.',
              '- [ ] Verify the 1.19.0 tag, GitHub release, ZIP/XPI digests and Mozilla-signing status after publication.': '- [x] Verify the 1.19.0 tag and GitHub release through Release run `32152724142`; `request_control-1.19.0.zip` and `.xpi` are both 225938 bytes with SHA-256 `3da8de30075b2f6e11e3fa265f26d60e89b038c23e5cf0b8fbd19aff9ab56e82`. Mozilla signing was skipped because AMO credentials are not configured.',
              '- No release blocker remains for 1.18.0 or 1.18.1; both milestones are published and verified.': '- No release blocker remains for 1.18.0, 1.18.1 or 1.19.0; all three milestones are published and verified.',
              '**Phases 1–9 are complete. Phase 10 is active.** The 1.19.0 candidate packages the already-validated Compatibility Guardian, Referer protection, source-site/DNR parity hardening and Firefox Android responsive-UI work into the next minor release. Promotion and post-release verification remain pending until the complete candidate is green.': '**Phases 1–10 are complete.** Request Control 1.19.0 is published and verified. The release contains the Compatibility Guardian, Referer protection, source-site/DNR parity hardening, Firefox Android responsive-UI work and hardened rule-import source handling. The next development work belongs to a new Phase 11.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected roadmap text: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/automation-complete-1.19.0-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md .github/workflows/automation-complete-1.19.0-roadmap.yml
          git commit -m "docs: complete 1.19.0 roadmap milestone"
          git push origin HEAD:docs/complete-1.19.0-roadmap