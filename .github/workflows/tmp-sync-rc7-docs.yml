name: Sync RC7 feedback docs

on:
  push:
    branches: [dev]
    paths: [.github/workflows/tmp-sync-rc7-docs.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Synchronize RC7 release status
        shell: python
        run: |
          from pathlib import Path

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text()
          old_status = "**Status: RC6 hands-on blockers are implemented and automated gates are green on `79e09ed6908e33b2216e62ebc317292fbf138c60` (Build #464); RC6 remains historical test evidence only. A fresh prerelease newer than RC6 is required for corrected desktop/Android hands-on validation before stable 1.20.0, followed by explicit user approval.**"
          new_status = "**Status: `1.20.0-rc.7` is the current corrected hands-on candidate after the RC6 feedback block. Automated release/security gates are green; stable 1.20.0 remains blocked on Firefox/Waterfox desktop and Firefox Android hands-on validation plus explicit user approval.**"
          if old_status not in text:
              raise SystemExit("ROADMAP status anchor missing")
          text = text.replace(old_status, new_status, 1)

          old_publish = "- [ ] Publish a fresh prerelease newer than RC6 only from an exact green candidate."
          new_publish = "- [x] Publish a fresh prerelease newer than RC6 only from an exact green candidate: `1.20.0-rc.7` from `c87197c17036ac193b86088832041bf05d26a99d`."
          if old_publish not in text:
              raise SystemExit("RC7 publish anchor missing")
          text = text.replace(old_publish, new_publish, 1)

          marker = "## Hands-on release gates — blocking"
          verification = "- [x] RC7 verification: Release workflow #15 passed tests/lint/build/lint-build on the exact tagged candidate; annotated tag resolves to `c87197c17036ac193b86088832041bf05d26a99d`; byte-identical ZIP/XPI are 260,315 bytes with SHA-256 `332042c6ea2f9ffbc287bed1f29c098a7dfc3c04103e4fb93acb2eb54f611ed2`; Mozilla publishing was intentionally skipped.\n\n"
          if marker not in text:
              raise SystemExit("Hands-on release gate marker missing")
          if "RC7 verification: Release workflow #15" not in text:
              text = text.replace(marker, verification + marker, 1)
          roadmap.write_text(text)
      - name: Commit synchronized documentation and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-sync-rc7-docs.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Record RC7 corrected hands-on candidate"
          git push origin HEAD:dev
