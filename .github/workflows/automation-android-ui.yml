name: Apply Firefox Android responsive UI fixes

on:
  push:
    branches:
      - fix/firefox-android-responsive-ui
    paths:
      - .github/workflows/automation-android-ui.yml
      - scripts/automation-android-ui.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/firefox-android-responsive-ui
          fetch-depth: 0
      - name: Apply responsive UI fixes
        run: python3 scripts/automation-android-ui.py
      - name: Remove one-shot automation
        run: rm .github/workflows/automation-android-ui.yml scripts/automation-android-ui.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve Firefox Android responsive UI"
          git push origin HEAD:fix/firefox-android-responsive-ui
