name: tmp-roadmap-inspect
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Inspect matcher contract
        run: |
          echo '=== api.js ==='
          sed -n '1,180p' src/main/api.js
          echo '=== matchers.js ==='
          sed -n '1,220p' src/main/matchers.js
          echo '=== dnr-url-boundaries ==='
          cat test/dnr-url-boundaries.test.js
          echo '=== patterns ==='
          cat test/patterns.test.js
          echo '=== url tests matcher references ==='
          grep -R -n -E 'createRequestMatcher|RequestMatcher|HostnameMatcher|UrlMatcher' test src/main | head -n 120
