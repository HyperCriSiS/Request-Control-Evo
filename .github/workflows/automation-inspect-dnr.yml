name: automation inspect Request Control test command
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/automation-inspect-dnr.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect package scripts and current DNR test style
        run: |
          cat package.json
          echo '=== compiler test sample ==='
          sed -n '1,180p' test/dnr-resource-type-parity.test.js
          echo '=== build workflow ==='
          find .github/workflows -maxdepth 1 -type f -print -exec sed -n '1,180p' {} \; | head -n 420
