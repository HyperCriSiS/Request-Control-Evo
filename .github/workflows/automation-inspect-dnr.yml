name: automation inspect scheme parity contract
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/automation-inspect-dnr.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scheme parity contract
        run: |
          echo '=== firefox filter parity test ==='
          cat test/dnr-firefox-filter-parity.test.js
          echo '=== scheme compiler ==='
          sed -n '88,115p' src/main/backends/dnr/compiler.js
          echo '=== createMatchPatterns ==='
          sed -n '105,145p' src/main/api.js
