name: automation record verified DNR scheme parity
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/automation-inspect-dnr.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update roadmap and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text()
          marker = '- [x] Prove Firefox/DNR resource-type parity for the shared WebRequest/DNR resource types; keep Firefox-only `beacon` explicitly unsupported.\n'
          addition = '- [x] Prove explicit/wildcard scheme parity (`http`, `https`, and `*` → HTTP(S)/WS(S), excluding FTP for wildcard) through the combined Firefox browser-prefilter/DNR harness (`589edce`); focused parity tests and lint are green.\n'
          if addition not in s:
              if marker in s:
                  s = s.replace(marker, marker + addition)
              else:
                  anchor = '## Phase 2'
                  pos = s.find(anchor)
                  if pos < 0:
                      raise SystemExit('roadmap phase anchor not found')
                  s = s[:pos] + addition + '\n' + s[pos:]
          p.write_text(s)
          PY
          rm .github/workflows/automation-inspect-dnr.yml
          git diff --check
          git config user.name HyperCriSiS
          git config user.email dev.github@w3b.world
          git add ROADMAP.md .github/workflows/automation-inspect-dnr.yml
          git commit -m 'docs: record DNR scheme parity'
          git push
