name: Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  repair-rule-ui-placeholder:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Restore target files and apply intended UI patch
        shell: bash
        run: |
          set -euo pipefail
          base=5068078b2f50f31071fa9b16e00a53d42b6d6d49
          git checkout "$base" -- .github/workflows/main.yml \
            src/options/rule-management-ui.js \
            src/options/rule-input.css \
            test/rule-management-ux.test.js \
            test/mobile-ui-regression.test.js
          git apply <<'PATCH'
          --- a/src/options/rule-management-ui.js
          +++ b/src/options/rule-management-ui.js
          @@ -118,11 +118,8 @@
                   body.rc-show-quick-share .rule-quick-actions [data-rule-command="share"],
                   body.rc-show-quick-delete .rule-quick-actions [data-rule-command="delete"] { display: inline-flex !important; }
                   .rule-header-buttons .btn-edit,
          -        .rule-header-buttons .btn-activate { display: inline-flex; align-items: center; justify-content: center; min-width: 2.2rem; width: 2.2rem; min-height: 2.2rem; padding: .3rem; overflow: hidden; font-size: 0; }
          -        .rule-header-buttons .btn-edit::before,
          -        .rule-header-buttons .btn-activate::before { font-size: 1.05rem; line-height: 1; }
          -        .rule-header-buttons .btn-edit::before { content: "✎"; }
          -        .rule-header-buttons .btn-activate::before { content: "⏻"; }
          +        .rule-header-buttons .btn-activate { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 2.2rem; min-width: 2.2rem; width: 2.2rem; min-height: 2.2rem; padding: .3rem; overflow: hidden; font-size: 0; }
          +        .rc-rule-control-icon { display: block; width: 1.1rem; height: 1.1rem; flex: 0 0 1.1rem; pointer-events: none; }
                   rule-input.disabled .rule-header-buttons .btn-activate { opacity: .72; }
                   .mobile-toolbar .rc-mobile-toolbar-close { display: none; }
                   @media (max-width: 42em) {
          @@ -135,6 +132,8 @@
                           margin-top: .45rem !important;
                           border: 1px solid currentColor;
                       }
          +            .rule-header-buttons .btn-edit,
          +            .rule-header-buttons .btn-activate { flex: 0 0 2.75rem; min-width: 2.75rem; width: 2.75rem; min-height: 2.75rem; }
                   }
                   @media (max-width: 35em) {
                       .rc-rule-group-control,
          @@ -445,6 +444,39 @@
               }
           }
           
          +const RULE_CONTROL_ICON_NS = "http://www.w3.org/2000/svg";
          +
          +function createRuleControlIcon(kind) {
          +    const svg = document.createElementNS(RULE_CONTROL_ICON_NS, "svg");
          +    svg.classList.add("rc-rule-control-icon");
          +    svg.dataset.ruleControlIcon = kind;
          +    svg.setAttribute("viewBox", "0 0 24 24");
          +    svg.setAttribute("fill", "none");
          +    svg.setAttribute("stroke", "currentColor");
          +    svg.setAttribute("stroke-width", "2");
          +    svg.setAttribute("stroke-linecap", "round");
          +    svg.setAttribute("stroke-linejoin", "round");
          +    svg.setAttribute("aria-hidden", "true");
          +    svg.setAttribute("focusable", "false");
          +
          +    const paths = kind === "edit"
          +        ? ["M4 20h4L19 9l-4-4L4 16v4Z", "m13.5 6.5 4 4"]
          +        : ["M12 2v10", "M5.64 5.64a9 9 0 1 0 12.72 0"];
          +    for (const d of paths) {
          +        const path = document.createElementNS(RULE_CONTROL_ICON_NS, "path");
          +        path.setAttribute("d", d);
          +        svg.append(path);
          +    }
          +    return svg;
          +}
          +
          +function ensureRuleControlIcon(button, kind) {
          +    const current = button.querySelector(".rc-rule-control-icon");
          +    if (current?.dataset.ruleControlIcon === kind) return;
          +    current?.remove();
          +    button.prepend(createRuleControlIcon(kind));
          +}
          +
           function decorateRuleRows() {
               document.querySelectorAll("rule-input").forEach((input) => {
                   const edit = input.querySelector(".btn-edit");
          @@ -452,6 +484,7 @@
                       const label = message("edit", "Edit");
                       edit.title = label;
                       edit.setAttribute("aria-label", label);
          +            ensureRuleControlIcon(edit, "edit");
                   }
           
                   const activate = input.querySelector(".btn-activate");
          @@ -459,6 +492,7 @@
                       const label = activate.textContent.trim() || message("disable", "Disable");
                       activate.title = label;
                       activate.setAttribute("aria-label", label);
          +            ensureRuleControlIcon(activate, "activate");
                   }
               });
               refreshGroupSuggestions();
          --- a/src/options/rule-input.css
          +++ b/src/options/rule-input.css
          @@ -160,9 +160,26 @@
           .header-info-wrap {
               display: flex;
               align-items: center;
          +    justify-content: flex-end;
          +    flex-wrap: wrap;
          +    gap: 0.65rem;
               text-align: end;
           }
           
          +.header-info-wrap > .information {
          +    display: flex;
          +    align-items: center;
          +    flex-wrap: wrap;
          +    gap: 0.3rem;
          +}
          +
          +.header-info-wrap > .rule-header-buttons {
          +    display: flex;
          +    align-items: center;
          +    justify-content: flex-end;
          +    gap: 0.35rem;
          +}
          +
           .col-trim-parameters {
               display: flex;
           }
          --- a/test/rule-management-ux.test.js
          +++ b/test/rule-management-ux.test.js
          @@ -5,6 +5,7 @@
           const optionsCss = fs.readFileSync(new URL("../src/options/options.css", import.meta.url), "utf8");
           const ruleListJs = fs.readFileSync(new URL("../src/options/rule-list.js", import.meta.url), "utf8");
           const ruleListCss = fs.readFileSync(new URL("../src/options/rule-list.css", import.meta.url), "utf8");
          +const ruleInputCss = fs.readFileSync(new URL("../src/options/rule-input.css", import.meta.url), "utf8");
           const ruleManagementUiJs = fs.readFileSync(new URL("../src/options/rule-management-ui.js", import.meta.url), "utf8");
           
           test("large rule collections expose persistent search, filters, grouping and sorting", () => {
          @@ -64,3 +65,23 @@
               expect(ruleListCss).toContain("rule-list .rule-list-empty-state");
               expect(ruleListCss).not.toContain("rule-list.view-empty {\n    display: none !important;");
           });
          +
          +test("Edit and Enable controls use deterministic centered vector icons", () => {
          +    expect(ruleManagementUiJs).toContain("function createRuleControlIcon(kind)");
          +    expect(ruleManagementUiJs).toContain('ensureRuleControlIcon(edit, "edit")');
          +    expect(ruleManagementUiJs).toContain('ensureRuleControlIcon(activate, "activate")');
          +    expect(ruleManagementUiJs).toContain('stroke", "currentColor"');
          +    expect(ruleManagementUiJs).toContain(".rc-rule-control-icon { display: block; width: 1.1rem; height: 1.1rem;");
          +    expect(ruleManagementUiJs).toContain("flex: 0 0 2.2rem");
          +    expect(ruleManagementUiJs).not.toContain('content: "✎"');
          +    expect(ruleManagementUiJs).not.toContain('content: "⏻"');
          +});
          +
          +test("rule state, metadata and compact controls have deliberate separation", () => {
          +    expect(ruleInputCss).toContain("gap: 0.65rem");
          +    expect(ruleInputCss).toContain(".header-info-wrap > .information");
          +    expect(ruleInputCss).toContain("gap: 0.3rem");
          +    expect(ruleInputCss).toContain(".header-info-wrap > .rule-header-buttons");
          +    expect(ruleInputCss).toContain("gap: 0.35rem");
          +});
          +
          --- a/test/mobile-ui-regression.test.js
          +++ b/test/mobile-ui-regression.test.js
          @@ -10,6 +10,7 @@
           const modalCss = fs.readFileSync(new URL("../src/options/modal-dialog.css", import.meta.url), "utf8");
           const popupCss = fs.readFileSync(new URL("../src/popup/browser-action.css", import.meta.url), "utf8");
           const inspectorCss = fs.readFileSync(new URL("../src/inspector/inspector.css", import.meta.url), "utf8");
          +const ruleManagementUiJs = fs.readFileSync(new URL("../src/options/rule-management-ui.js", import.meta.url), "utf8");
           
           test("mobile rule selection remains reachable instead of being hidden", () => {
               expect(ruleInputCss).toContain(".editing .rule-select");
          @@ -81,3 +82,10 @@
               expect(ruleImportJs).toContain("if (this._selectionListDirty)");
               expect(ruleImportJs).toContain("this._selectionListDirty = false");
           });
          +
          +test("compact rule icons stay centered while retaining Android touch targets", () => {
          +    expect(ruleManagementUiJs).toContain(".rc-rule-control-icon { display: block; width: 1.1rem; height: 1.1rem;");
          +    expect(ruleManagementUiJs).toContain("flex: 0 0 2.75rem");
          +    expect(ruleManagementUiJs).toContain("min-width: 2.75rem; width: 2.75rem; min-height: 2.75rem");
          +});
          +
          PATCH
          node --check src/options/rule-management-ui.js
          node --check test/rule-management-ux.test.js
          node --check test/mobile-ui-regression.test.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/main.yml src/options/rule-management-ui.js src/options/rule-input.css test/rule-management-ux.test.js test/mobile-ui-regression.test.js
          git commit -m "Restore rule UI and apply icon spacing fix"
          git push origin HEAD:dev

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --coverage
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-pandoc
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-ext-artifacts
          path: web-ext-artifacts/*.zip
          if-no-files-found: error

  lint-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: web-ext-artifacts
          path: web-ext-artifacts
      - run: npm ci
      - run: npm run lint-build

  checker:
    if: always()
    needs:
      - audit
      - lint
      - test
      - build
      - lint-build
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          AUDIT: ${{ needs.audit.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          LINT_BUILD: ${{ needs.lint-build.result }}
        run: |
          test "$AUDIT" = "success"
          test "$LINT" = "success"
          test "$TEST" = "success"
          test "$BUILD" = "success"
          test "$LINT_BUILD" = "success"
