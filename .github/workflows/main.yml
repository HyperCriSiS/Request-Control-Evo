name: Build

on:
  push:
    branches:
      - master
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  record-rc7-roadmap:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Record RC7 and restore normal workflow
        shell: bash
        run: |
          set -euo pipefail
          base=0aee0f7a59468b6ced7a5f35ef86f8ab65bf8950
          git checkout "$base" -- .github/workflows/main.yml
          python <<'PY'
          from pathlib import Path
          path = Path("ROADMAP.md")
          text = path.read_text()
          old_status = "**Status: RC6 hands-on blockers are implemented and automated gates are green on `79e09ed6908e33b2216e62ebc317292fbf138c60` (Build #464); RC6 remains historical test evidence only. A fresh prerelease newer than RC6 is required for corrected desktop/Android hands-on validation before stable 1.20.0, followed by explicit user approval.**"
          new_status = "**Status: `1.20.0-rc.7` is the current corrected hands-on candidate after the RC6 feedback block. Automated release/security gates are green; stable 1.20.0 remains blocked on Firefox/Waterfox desktop and Firefox Android hands-on validation plus explicit user approval.**"
          if old_status in text:
              text = text.replace(old_status, new_status, 1)
          elif new_status not in text:
              raise SystemExit("ROADMAP status anchor missing")
          publish = "- [ ] Publish a fresh prerelease newer than RC6 only from an exact green candidate."
          published = "- [x] Publish a fresh prerelease newer than RC6 only from an exact green candidate: `1.20.0-rc.7` from `c87197c17036ac193b86088832041bf05d26a99d`."
          if publish in text:
              text = text.replace(publish, published, 1)
          elif published not in text:
              raise SystemExit("Publish gate anchor missing")
          marker = "## Hands-on release gates — blocking"
          section = '''## 1.20.0 RC7 corrected prerelease gate — complete

- [x] Exact RC7 candidate: `c87197c17036ac193b86088832041bf05d26a99d`.
- [x] Pre-release code gate: Build #464 green on the final functional UI code; RC7 Release workflow #15 re-ran tests, lint, build and lint-build successfully on the exact tagged candidate.
- [x] Current code-scanning alerts: 0.
- [x] Current Dependabot alerts: 0.
- [x] Current secret-scanning alerts: 0.
- [x] Current repository security advisories in triage: 0.
- [x] Annotated tag `1.20.0-rc.7` resolves exactly to the candidate commit.
- [x] Unsigned ZIP/XPI are byte-identical: 260,315 bytes; SHA-256 `332042c6ea2f9ffbc287bed1f29c098a7dfc3c04103e4fb93acb2eb54f611ed2`.
- [x] Mozilla signing/publishing intentionally skipped for prerelease testing.
- [x] `CHANGELOG.md` remains `1.20.0 - Unreleased` while documenting corrected exact-site controls, lossless Filter state and deterministic compact SVG controls.
- [x] Any later ROADMAP-only synchronization does not change the RC7 extension artifact or tagged candidate.

'''
          if marker not in text:
              raise SystemExit("Hands-on marker missing")
          if "## 1.20.0 RC7 corrected prerelease gate" not in text:
              text = text.replace(marker, section + marker, 1)
          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/main.yml ROADMAP.md
          git commit -m "Record RC7 corrected hands-on candidate"
          git push origin HEAD:dev

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm run audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test -- --ci --coverage
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-pandoc
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-ext-artifacts
          path: web-ext-artifacts/*.zip
          if-no-files-found: error

  lint-build:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: web-ext-artifacts
          path: web-ext-artifacts
      - run: npm ci
      - run: npm run lint-build

  checker:
    if: always()
    needs:
      - audit
      - lint
      - test
      - build
      - lint-build
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          AUDIT: ${{ needs.audit.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          LINT_BUILD: ${{ needs.lint-build.result }}
        run: |
          test "$AUDIT" = "success"
          test "$LINT" = "success"
          test "$TEST" = "success"
          test "$BUILD" = "success"
          test "$LINT_BUILD" = "success"
