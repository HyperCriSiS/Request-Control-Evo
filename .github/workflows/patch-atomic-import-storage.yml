name: Patch atomic import storage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/atomic-import-storage
          fetch-depth: 0
      - name: Sync and patch feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-edit origin/master
          python <<'PY'
          from pathlib import Path

          p = Path('src/options/options.js')
          s = p.read_text()
          s = s.replace(
              'import { normalizeImportSource } from "./import-source.js";\n',
              'import { normalizeImportSource } from "./import-source.js";\nimport { persistImportState } from "./import-storage.js";\n',
              1,
          )
          s = s.replace(
              'document.addEventListener("rule-import-delete-imported", onRemoveImportedRules);',
              'document.addEventListener("rule-import-delete-imported", (e) => {\n    onRemoveImportedRules(e).catch(showAlertPopup);\n});',
              1,
          )
          s = s.replace(
              '''    await browser.storage.local.set({ rules: reconciliation.rules });\n    document.querySelectorAll("rule-list").forEach((list) => list.removeAll());\n    createRuleInputs(reconciliation.rules);\n\n    const managedUuids = reconciliation.rules\n''',
              '''    const managedUuids = reconciliation.rules\n''',
              1,
          )
          s = s.replace(
              '''    await browser.storage.local.set({ imports });\n    input.dataset.importKey = src;\n''',
              '''    await persistImportState(browser.storage.local, reconciliation.rules, imports);\n    document.querySelectorAll("rule-list").forEach((list) => list.removeAll());\n    createRuleInputs(reconciliation.rules);\n    input.dataset.importKey = src;\n''',
              1,
          )
          old = '''async function onRemoveImportedRules(e) {\n    const input = e.target;\n    const { rules } = await browser.storage.local.get("rules");\n\n    if (rules) {\n        const { uuids } = input.data.imported;\n        const newRules = rules.filter(({ uuid }) => !uuids.includes(uuid));\n        await browser.storage.local.set({ rules: newRules });\n        document.querySelectorAll("rule-list").forEach((list) => list.removeAll());\n        createRuleInputs(newRules);\n    }\n    const src = input.source;\n    const { imports } = await browser.storage.local.get("imports");\n\n    if (imports && src in imports) {\n        const { data } = input;\n        delete data.imported;\n        imports[src] = data;\n        browser.storage.local.set({ imports });\n    }\n    input.data = {};\n}\n'''
          new = '''async function onRemoveImportedRules(e) {\n    const input = e.target;\n    const src = input.source;\n    const { rules = [], imports = {} } = await browser.storage.local.get(["rules", "imports"]);\n    const importedUuids = Array.isArray(input.data?.imported?.uuids)\n        ? new Set(input.data.imported.uuids)\n        : new Set();\n    const newRules = rules.filter(({ uuid }) => !importedUuids.has(uuid));\n    const nextImports = { ...imports };\n\n    if (src in nextImports) {\n        const data = { ...nextImports[src] };\n        delete data.imported;\n        nextImports[src] = data;\n    }\n\n    await persistImportState(browser.storage.local, newRules, nextImports);\n\n    document.querySelectorAll("rule-list").forEach((list) => list.removeAll());\n    createRuleInputs(newRules);\n    input.data = nextImports[src] || {};\n}\n'''
          if old not in s:
              raise SystemExit('Expected imported-rule removal block not found')
          p.write_text(s.replace(old, new, 1))

          Path('src/options/import-storage.js').write_text('''/* This Source Code Form is subject to the terms of the Mozilla Public\n * License, v. 2.0. If a copy of the MPL was not distributed with this\n * file, You can obtain one at http://mozilla.org/MPL/2.0/. */\n\nexport function persistImportState(storage, rules, imports) {\n    return storage.set({ rules, imports });\n}\n''')

          Path('test/import-storage-atomicity.test.js').write_text('''import fs from "node:fs";\n\nimport { persistImportState } from "../src/options/import-storage.js";\n\nconst optionsSource = fs.readFileSync(new URL("../src/options/options.js", import.meta.url), "utf8");\n\nfunction functionBody(name, nextName) {\n    const start = optionsSource.indexOf(`function ${name}`);\n    const asyncStart = optionsSource.indexOf(`async function ${name}`);\n    const actualStart = start === -1 || (asyncStart !== -1 && asyncStart < start) ? asyncStart : start;\n    const nextFunction = optionsSource.indexOf(`function ${nextName}`, actualStart + 1);\n    const nextAsyncFunction = optionsSource.indexOf(`async function ${nextName}`, actualStart + 1);\n    const candidates = [nextFunction, nextAsyncFunction].filter((value) => value !== -1);\n    const end = candidates.length ? Math.min(...candidates) : optionsSource.length;\n    return optionsSource.slice(actualStart, end);\n}\n\ntest("import state persists rules and metadata in one storage operation", async () => {\n    const calls = [];\n    const storage = {\n        set: async (payload) => calls.push(payload),\n    };\n    const rules = [{ uuid: "one" }];\n    const imports = { source: { imported: { uuids: ["one"] } } };\n\n    await persistImportState(storage, rules, imports);\n\n    expect(calls).toEqual([{ rules, imports }]);\n});\n\ntest("managed import updates UI only after atomic persistence", () => {\n    const body = functionBody("applyManagedImport", "markLegacyImportedRules");\n    const persist = body.indexOf("await persistImportState(browser.storage.local, reconciliation.rules, imports)");\n    const rebuild = body.indexOf('document.querySelectorAll("rule-list").forEach((list) => list.removeAll())');\n\n    expect(persist).toBeGreaterThan(-1);\n    expect(rebuild).toBeGreaterThan(persist);\n    expect(body).not.toContain("browser.storage.local.set({ rules: reconciliation.rules })");\n});\n\ntest("removing imported rules persists rules and import metadata together and reports failures", () => {\n    const body = functionBody("onRemoveImportedRules", "createImportInput");\n\n    expect(body).toContain('browser.storage.local.get(["rules", "imports"])');\n    expect(body).toContain("await persistImportState(browser.storage.local, newRules, nextImports)");\n    expect(optionsSource).toContain("onRemoveImportedRules(e).catch(showAlertPopup)");\n});\n''')
          PY
          git add src/options/options.js src/options/import-storage.js test/import-storage-atomicity.test.js
          git commit -m "Persist managed imports atomically"
          git push origin HEAD:fix/atomic-import-storage
      - name: Remove one-time workflow from master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B master origin/master
          git rm .github/workflows/patch-atomic-import-storage.yml
          git commit -m "Remove one-time atomic import patcher"
          git push origin master
