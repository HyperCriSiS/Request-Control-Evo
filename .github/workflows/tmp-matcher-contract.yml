name: tmp matcher normalization contract

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-matcher-contract.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect rule-to-matcher pipeline
        shell: bash
        run: |
          set -e
          echo '=== matchers.js ==='
          sed -n '1,240p' src/main/matchers.js
          echo '=== rule base ==='
          sed -n '1,220p' src/main/rules/base.js
          echo '=== control matcher call sites ==='
          grep -R -n -E 'createRequestMatcher|new .*Matcher|\.matches\(' src/main test | head -n 220 || true
          echo '=== pattern/normalization call sites ==='
          grep -R -n -E 'pattern|normalize|createRule|fromJSON|parseRule' src/main/rules src/main/control.js src/main/url.js test/patterns.test.js | head -n 300 || true
