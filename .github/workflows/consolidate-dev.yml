name: Consolidate dev into master

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-pandoc

      - name: Validate exact dev snapshot and consolidate histories
        env:
          EXPECTED_DEV: fb9867a06d33919f5e3d8c10bbed51f08703c4c6
        run: |
          set -euo pipefail

          git fetch origin master dev --tags --force
          MASTER=$(git rev-parse origin/master)
          DEV=$(git rev-parse origin/dev)

          if [[ "$DEV" != "$EXPECTED_DEV" ]]; then
            echo "dev moved: expected $EXPECTED_DEV, got $DEV"
            exit 1
          fi

          git checkout --detach "$DEV"
          npm ci
          npm run audit
          npm test -- --ci
          npm run lint
          npm run build
          npm run lint-build

          TREE=$(git rev-parse "${DEV}^{tree}")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MERGE_COMMIT=$(printf '%s\n\n%s\n' \
            "Consolidate validated 1.20 integration on master" \
            "Join the historical master and dev lines without conflict-by-conflict replay. The resulting tree is exactly the green dev snapshot $DEV; both histories remain parents of this commit. Stable publication remains separately gated." \
            | git commit-tree "$TREE" -p "$MASTER" -p "$DEV")

          if [[ "$(git rev-parse "${MERGE_COMMIT}^{tree}")" != "$TREE" ]]; then
            echo "Consolidation tree mismatch."
            exit 1
          fi

          git fetch origin master --force
          LATEST_MASTER=$(git rev-parse origin/master)
          if [[ "$LATEST_MASTER" != "$MASTER" ]]; then
            echo "master moved during validation: expected $MASTER, got $LATEST_MASTER"
            exit 1
          fi

          git push origin "$MERGE_COMMIT:refs/heads/master"

          echo "Consolidated master $MASTER and dev $DEV as $MERGE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
