name: Repair DNR semantic corrections

on:
  push:
    branches:
      - feature/mv3-compiler
    paths:
      - .github/workflows/repair-dnr-semantics.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/mv3-compiler
      - name: Apply semantic corrections
        run: |
          python <<'PY'
          from pathlib import Path

          compiler = Path('src/main/backends/dnr/compiler.js')
          text = compiler.read_text()
          old = '''        case "same-domain":\n            conditionBase.domainType = "firstParty";\n            break;\n        case "third-party-domain":\n            conditionBase.domainType = "thirdParty";\n            break;\n        case "same-origin":\n        case "third-party-origin":\n            return {\n                diagnostics: [\n                    diagnostic(\n                        "origin-matcher-unsupported",\n                        "DNR domainType compares registrable domains, not full origins."\n                    ),\n                ],\n            };\n'''
          new = '''        case "same-domain":\n        case "third-party-domain":\n            return {\n                diagnostics: [\n                    diagnostic(\n                        "domain-matcher-unsupported",\n                        "Request Control currently resolves registrable domains with ICANN-only tldts defaults, while Chromium DNR domainType includes private registries. The mapping is not treated as exact."\n                    ),\n                ],\n            };\n        case "same-origin":\n        case "third-party-origin":\n            return {\n                diagnostics: [\n                    diagnostic(\n                        "origin-matcher-unsupported",\n                        "DNR domainType compares registrable domains, not full origins."\n                    ),\n                ],\n            };\n'''
          if old not in text:
              raise SystemExit('origin matcher block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'typeof rule.redirectUrl !== "string" || rule.redirectUrl.includes("[")',
              'typeof rule.redirectUrl !== "string" || rule.redirectUrl.includes("[") || rule.redirectUrl.includes("{")'
          )
          compiler.write_text(text)

          tests = Path('test/dnr-compiler.test.js')
          text = tests.read_text()
          old_test = '''test("compiles same-domain and request-method matching using native DNR conditions", () => {\n    const result = compileRuleToDnr(\n        baseRule({\n            pattern: {\n                scheme: "*",\n                host: ["*.example.com"],\n                path: ["api/*"],\n                origin: "same-domain",\n                method: ["GET", "post"],\n            },\n            types: ["xmlhttprequest"],\n        })\n    );\n\n    expect(result.status).toBe("supported");\n    expect(result.rules[0].condition).toMatchObject({\n        domainType: "firstParty",\n        requestMethods: ["get", "post"],\n        resourceTypes: ["xmlhttprequest"],\n    });\n    expect(result.rules[0].condition.regexFilter).toContain("(?:http|https|ws|wss)");\n});\n'''
          new_test = '''test("compiles supported request methods using native DNR conditions", () => {\n    const result = compileRuleToDnr(\n        baseRule({\n            pattern: {\n                scheme: "*",\n                host: ["*.example.com"],\n                path: ["api/*"],\n                method: ["GET", "post"],\n            },\n            types: ["xmlhttprequest"],\n        })\n    );\n\n    expect(result.status).toBe("supported");\n    expect(result.rules[0].condition).toMatchObject({\n        requestMethods: ["get", "post"],\n        resourceTypes: ["xmlhttprequest"],\n    });\n    expect(result.rules[0].condition.regexFilter).toContain("(?:http|https|ws|wss)");\n});\n\ntest("does not equate Request Control domain matching with Chromium private-registry semantics", () => {\n    const result = compileRuleToDnr(\n        baseRule({\n            pattern: { scheme: "https", host: ["example.com"], path: ["*"], origin: "same-domain" },\n        })\n    );\n\n    expect(result.status).toBe("unsupported");\n    expect(result.diagnostics.map(({ code }) => code)).toContain("domain-matcher-unsupported");\n});\n'''
          if old_test not in text:
              raise SystemExit('domain matcher test not found')
          text = text.replace(old_test, new_test, 1)
          text = text.replace(
              '''    const dsl = compileRuleToDnr(\n        baseRule({ action: "redirect", redirectUrl: "https://destination.example/[path]" })\n    );\n\n    expect(simple).toMatchObject({''',
              '''    const dsl = compileRuleToDnr(\n        baseRule({ action: "redirect", redirectUrl: "https://destination.example/[path]" })\n    );\n    const parameterDsl = compileRuleToDnr(\n        baseRule({ action: "redirect", redirectUrl: "https://destination.example/{path}" })\n    );\n\n    expect(simple).toMatchObject({'''
          )
          text = text.replace(
              '''    expect(dsl.status).toBe("unsupported");\n    expect(dsl.diagnostics.map(({ code }) => code)).toContain("redirect-dsl-unsupported");\n});''',
              '''    expect(dsl.status).toBe("unsupported");\n    expect(parameterDsl.status).toBe("unsupported");\n    expect(dsl.diagnostics.map(({ code }) => code)).toContain("redirect-dsl-unsupported");\n    expect(parameterDsl.diagnostics.map(({ code }) => code)).toContain("redirect-dsl-unsupported");\n});'''
          )
          tests.write_text(text)
          PY
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/backends/dnr/compiler.js test/dnr-compiler.test.js
          git commit -m "fix: keep unproven DNR semantics non-activatable"
          git push origin HEAD:feature/mv3-compiler
