name: Sync 1.17.0 release roadmap

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/automation-sync-1.17.0-roadmap.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Update roadmap release state
        shell: python
        run: |
          from pathlib import Path

          path = Path("ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          old = "- [ ] Set `manifest.json` to version 1.17.0 and add a matching `CHANGELOG.md` section on `release/1.17.0`."
          new = "- [x] Set `manifest.json` to version 1.17.0 and add a matching `CHANGELOG.md` section on `release/1.17.0` (`6e331d5c`); merge-only conflicts with the 1.16.1 `master` metadata were resolved without changing release semantics in `c1d69b91`."
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Expected release metadata roadmap item not found")

          marker = "Release preparation has started using the repository's established branch convention: `release/1.17.0` was created from validated `dev` commit `0bf7e883`. A minor-version bump is appropriate because the candidate adds user-visible SPA/history-state behavior and new exact compatibility semantics beyond the 1.16.1 baseline. The remaining release work is to align `manifest.json` and `CHANGELOG.md` on that release branch, promote the validated release candidate to `master`, and verify the self-contained release workflow/tag/artifact result."
          replacement = marker + "\n\nThe release metadata is now aligned at 1.17.0 (`6e331d5c`). PR #18 promotes `release/1.17.0` to `master`. Its only merge conflicts were the expected `CHANGELOG.md` and `manifest.json` version-history overlap with 1.16.1; those were resolved by retaining the validated 1.17.0 release metadata while merging current `master` in `c1d69b91`. Promotion remains open until the PR checks complete successfully."
          if marker in text and "The release metadata is now aligned at 1.17.0 (`6e331d5c`)." not in text:
              text = text.replace(marker, replacement, 1)

          old_status = "Release preparation for 1.17.0 has started on `release/1.17.0`; the remaining work is version/changelog alignment, promotion to `master`, and verification of the resulting release workflow/tag/artifact state."
          new_status = "Release metadata for 1.17.0 is aligned and PR #18 is open against `master`; the remaining work is successful PR validation/promotion and verification of the resulting release workflow/tag/artifact state."
          if old_status in text:
              text = text.replace(old_status, new_status, 1)

          path.write_text(text, encoding="utf-8")
      - name: Commit roadmap
        run: |
          if git diff --quiet -- ROADMAP.md; then
            echo "ROADMAP.md already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "docs: record 1.17.0 release promotion state"
          git push origin HEAD:dev
