name: Capture add-on lint diagnostics

on:
  push:
    branches:
      - feature/modernization
    paths:
      - .github/workflows/capture-addon-lint.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/modernization
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: npm ci
      - run: npm run build
      - name: Capture strict linter output
        continue-on-error: true
        run: |
          ZIP="web-ext-artifacts/request_control-$(node -p \"require('./manifest.json').version\").zip"
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "--- source manifest ---"
            cat manifest.json
            echo "--- packaged manifest ---"
            unzip -p "$ZIP" manifest.json
            echo "--- addons-linter ---"
            npx addons-linter --warnings-as-errors "$ZIP"
          } > .addon-lint-diagnostics.txt 2>&1
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .addon-lint-diagnostics.txt
          git commit -m "chore: capture add-on lint diagnostics" || exit 0
          git push origin HEAD:feature/modernization
