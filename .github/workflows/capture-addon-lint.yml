name: Capture add-on lint diagnostics

on:
  push:
    branches:
      - feature/modernization
    paths:
      - .github/workflows/capture-addon-lint.yml

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/modernization
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: npm ci
      - run: npm run build
      - name: Capture strict linter output
        id: strict
        continue-on-error: true
        run: |
          ZIP="web-ext-artifacts/request_control-$(node -p \"require('./manifest.json').version\").zip"
          {
            echo '```text'
            echo "HEAD=$(git rev-parse HEAD)"
            echo "--- packaged manifest ---"
            unzip -p "$ZIP" manifest.json
            echo "--- addons-linter ---"
            npx addons-linter --warnings-as-errors "$ZIP"
            echo '```'
          } > /tmp/addon-lint-comment.md 2>&1
      - name: Post diagnostics to PR 2
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 2 --repo HyperCriSiS/requestcontrol --body-file /tmp/addon-lint-comment.md
