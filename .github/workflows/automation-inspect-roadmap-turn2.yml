name: Automation Inspect Roadmap Turn 2
on:
  push:
    paths:
      - '.github/workflows/automation-inspect-roadmap-turn2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Inspect roadmap and DNR targets
        shell: bash
        run: |
          echo '=== ROADMAP ==='
          cat ROADMAP.md
          echo '=== RECENT COMMITS ==='
          git log -15 --oneline
          echo '=== REAL WORLD TEST ==='
          cat test/dnr-real-world-rules.test.js
          echo '=== SUPPORTED SUBSET ==='
          cat docs/mv3-supported-subset.md
          echo '=== BING CATALOG ==='
          cat rules/privacy-bing.json
          echo '=== DUCKDUCKGO CATALOG ==='
          cat rules/privacy-duckduckgo.json
          echo '=== HERE CATALOG ==='
          cat rules/privacy-here.json
          echo '=== LINKEDIN CATALOG ==='
          cat rules/privacy-linkedin.json
