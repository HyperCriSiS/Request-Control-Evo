name: Validate composed method DNR parity
on: [push]
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run focused parity fixture
        run: |
          npm test -- test/dnr-method-composed-parity.test.js
          git diff --check
      - name: Record validated fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          s = p.read_text(encoding='utf-8')
          entry = '- [x] Prove composed Firefox↔DNR parity when an exact HTTP method is combined with scheme + explicit port + path + resource type, preventing method constraints from being widened during composition.\n'
          if entry not in s:
              anchor = '- [x] Prove composed Firefox↔DNR parity for scheme + explicit port + path + resource type in one rule, guarding against semantic widening when individually supported condition classes are combined.\n'
              if anchor not in s:
                  raise SystemExit('composed parity roadmap anchor missing')
              s = s.replace(anchor, anchor + entry, 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/automation-method-composed-parity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: cover composed method DNR parity'
          git push origin HEAD:dev
