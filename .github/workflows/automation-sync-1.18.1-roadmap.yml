name: Sync completed 1.18.1 roadmap

on:
  push:
    branches:
      - docs/sync-1.18.1-roadmap

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Copy completed roadmap from dev
        run: |
          git fetch origin dev
          git checkout origin/dev -- ROADMAP.md
          git rm .github/workflows/automation-sync-1.18.1-roadmap.yml
          git add ROADMAP.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync completed 1.18.1 roadmap"
          git push origin HEAD:docs/sync-1.18.1-roadmap
