name: Refresh dependency lockfile

on:
  push:
    branches:
      - chore/dependency-refresh-2026-08
    paths:
      - package.json
      - scripts/audit-dependencies.mjs
      - .github/workflows/automation-refresh-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Refresh compatible dependency graph
        run: npm update --package-lock-only --ignore-scripts

      - name: Verify legacy vulnerable packages are gone
        run: |
          node <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages || {};
          const minimums = new Map([
            ['js-yaml', '3.15.1'],
            ['brace-expansion', '1.1.16'],
          ]);

          const compare = (a, b) => {
            const pa = a.split('.').map(Number);
            const pb = b.split('.').map(Number);
            for (let i = 0; i < Math.max(pa.length, pb.length); i += 1) {
              const delta = (pa[i] || 0) - (pb[i] || 0);
              if (delta) return delta;
            }
            return 0;
          };

          for (const [packagePath, metadata] of Object.entries(packages)) {
            if (!packagePath.startsWith('node_modules/')) continue;
            const packageName = packagePath.split('node_modules/').at(-1);
            const minimum = minimums.get(packageName);
            if (!minimum || !metadata.version) continue;
            if (compare(metadata.version, minimum) < 0) {
              throw new Error(`${packagePath} remains vulnerable at ${metadata.version}; expected >= ${minimum}`);
            }
          }
          NODE

      - name: Enforce dependency audit policy
        run: npm run audit

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push
