name: automation inspect composed dnr parity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect parity test patterns
        run: |
          echo '=== port parity ==='
          cat test/dnr-port-parity.test.js
          echo '=== resource type parity ==='
          cat test/dnr-resource-type-parity.test.js
          echo '=== scheme parity ==='
          cat test/dnr-scheme-parity.test.js
          echo '=== compiler supported condition fields ==='
          grep -n -B8 -A20 -E 'resourceTypes|regexFilter|urlFilter|requestMethods|initiatorDomains|excluded' src/environment/background/script/dnr/compiler.js | head -n 300 || true
