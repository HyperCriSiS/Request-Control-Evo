name: automation validate composed dnr parity
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add composed Firefox-DNR parity fixture
        run: |
          cp test/dnr-port-parity.test.js /tmp/port.js
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/port.js').read_text()
          start = src.index('function escapeRegex')
          end = src.index('test("explicit ports')
          helpers = src[start:end]
          content = '''import { createRequestFilters } from "../src/main/api.js";\nimport { compileRuleToDnr } from "../src/main/backends/dnr/compiler.js";\n\nfunction blockRule(pattern) {\n    return {\n        uuid: "firefox-dnr-composed-parity",\n        active: true,\n        pattern,\n        types: ["xmlhttprequest"],\n        action: "block",\n    };\n}\n\n''' + helpers + '''test("scheme, explicit port, path and resource type compose without widening semantics", () => {\n    const rule = blockRule({\n        scheme: "https",\n        host: ["example.com:8443"],\n        path: ["api/*"],\n    });\n    const firefoxFilters = createRequestFilters(rule);\n    const compiled = compileRuleToDnr(rule);\n\n    expect(firefoxFilters).toHaveLength(1);\n    expect(firefoxFilters[0].types).toEqual(["xmlhttprequest"]);\n    expect(compiled.status).toBe("supported");\n    expect(compiled.rules).toHaveLength(1);\n    expect(compiled.rules[0].condition.resourceTypes).toEqual(["xmlhttprequest"]);\n\n    const cases = [\n        ["https://example.com:8443/api/v1", true],\n        ["https://example.com:8443/other", false],\n        ["https://example.com/api/v1", false],\n        ["http://example.com:8443/api/v1", false],\n        ["https://sub.example.com:8443/api/v1", false],\n    ];\n    for (const [url, expected] of cases) {\n        expect(firefoxWouldMatch(rule, url)).toBe(expected);\n        expect(dnrWouldMatch(rule, url)).toBe(expected);\n    }\n});\n'''
          Path('test/dnr-composed-parity.test.js').write_text(content)
          r = Path('ROADMAP.md')
          rt = r.read_text()
          entry = '- [x] Prove composed Firefox↔DNR parity for scheme + explicit port + path + resource type in one rule, guarding against semantic widening when individually supported condition classes are combined.\n'
          if entry not in rt:
              marker = 'port'
              pos = rt.lower().find(marker)
              if pos >= 0:
                  pos = rt.find('\n', pos) + 1
                  rt = rt[:pos] + entry + rt[pos:]
              else:
                  rt += '\n' + entry
          r.write_text(rt)
          PY
          npm ci
          npm test -- test/dnr-composed-parity.test.js
          git diff --check
      - name: Commit validated parity fixture and remove helper
        run: |
          rm .github/workflows/automation-inspect-dnr-composed-parity.yml
          git config user.name 'HyperCriSiS'
          git config user.email 'dev.github@w3b.world'
          git add test/dnr-composed-parity.test.js ROADMAP.md .github/workflows/automation-inspect-dnr-composed-parity.yml
          git diff --cached --check
          git commit -m 'test: cover composed DNR filter parity'
          git push origin HEAD:dev
