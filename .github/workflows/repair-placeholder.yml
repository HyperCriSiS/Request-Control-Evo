name: One-shot placeholder repair

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/repair-placeholder.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore files and apply intended changes
        run: python .github/repair-placeholder.py
      - name: Commit repaired tree
        run: |
          rm .github/workflows/repair-placeholder.yml .github/repair-placeholder.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair placeholder write and simplify import package rows"
          git push origin HEAD:dev
