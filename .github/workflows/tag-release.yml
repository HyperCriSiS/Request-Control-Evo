name: Tag release

on:
  push:
    branches:
      - master
    paths:
      - manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version '$VERSION' is not a stable SemVer release; skipping tag."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check existing tag
        if: steps.version.outputs.release == 'true'
        id: existing
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify release candidate
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          npm ci
          npm test -- --ci
          npm run lint
          npm run build
          npm run lint-build
      - name: Create release tag
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Request Control ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
