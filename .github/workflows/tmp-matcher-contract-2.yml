name: tmp matcher construction

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tmp-matcher-contract-2.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect request matcher construction
        shell: bash
        run: |
          echo '=== api.js ==='
          sed -n '1,220p' src/main/api.js
          echo '=== request rule ==='
          sed -n '1,240p' src/main/rules/request.js
          echo '=== patterns ==='
          sed -n '1,280p' src/main/patterns.js
          echo '=== relevant tests ==='
          sed -n '1,260p' test/patterns.test.js
          sed -n '1,260p' test/dnr-url-boundaries.test.js
