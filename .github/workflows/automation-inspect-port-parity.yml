name: automation inspect port parity
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/automation-inspect-port-parity.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect explicit-port Firefox contract
        run: |
          node --input-type=module <<'NODE'
          import { createRequestFilters } from './src/main/api.js';
          const rule = {
            uuid: 'port-contract', active: true,
            pattern: { scheme: 'https', host: ['example.com:8443'], path: ['*'] },
            types: ['xmlhttprequest'], action: 'block'
          };
          const filters = createRequestFilters(rule);
          console.log('FILTERS', JSON.stringify(filters.map(f => ({urls:f.urls, types:f.types})), null, 2));
          for (const url of ['https://example.com:8443/path','https://example.com/path','https://example.com:443/path']) {
            console.log(url, filters.map(f => f.matcher.test({url})));
          }
          NODE