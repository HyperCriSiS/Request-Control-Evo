name: Sync 1.18.0 promotion branch

on:
  push:
    branches:
      - chore/promote-1.18.0-clean

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace branch tree with validated dev tree
        run: |
          git fetch origin dev
          git rm -rf .
          git checkout origin/dev -- .
          git add -A

          if git diff --cached --quiet; then
            echo "Promotion branch already matches dev."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: promote validated Request Control 1.18.0"
          git push origin HEAD:chore/promote-1.18.0-clean
