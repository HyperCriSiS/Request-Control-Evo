name: automation inspect Firefox DNR parity
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-parity.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect parity contract
        run: |
          echo '=== ROADMAP ==='
          cat ROADMAP.md
          echo '=== api filter contract ==='
          grep -n -A95 -B20 'createRequestFilters' src/main/api.js
          echo '=== matchers helpers ==='
          grep -n -A180 -B20 'createMatchPatterns' src/main/matchers.js
          echo '=== DNR compiler ==='
          sed -n '1,360p' src/main/backends/dnr/compiler.js
          echo '=== existing DNR tests ==='
          for f in test/*dnr*.test.js; do echo "--- $f"; cat "$f"; done
          echo '=== package scripts ==='
          cat package.json
