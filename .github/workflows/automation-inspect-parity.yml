name: automation inspect Firefox DNR parity

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/automation-inspect-parity.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print parity context
        run: |
          echo '=== ROADMAP ==='
          cat ROADMAP.md
          echo '=== api.js ==='
          sed -n '1,220p' src/main/api.js
          echo '=== dnr compiler ==='
          sed -n '1,320p' src/main/backends/dnr/compiler.js
          echo '=== request filters tests ==='
          cat test/request-filters.test.js
          echo '=== url boundary tests ==='
          cat test/dnr-url-boundaries.test.js
          echo '=== package scripts ==='
          cat package.json
