name: Release

on:
  push:
    branches:
      - master
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Manifest version '$VERSION' is not a stable SemVer release; skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing tag and release
        if: steps.version.outputs.release == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch --tags --force
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing release tag for recovery
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.tag == 'true' && steps.existing.outputs.release == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git checkout --detach "$VERSION"
          TAG_VERSION=$(node -p "require('./manifest.json').version")
          test "$TAG_VERSION" = "$VERSION"

      - name: Install build dependency
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.release == 'false'
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Verify and build release artifact
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.release == 'false'
        run: |
          npm ci
          npm test -- --ci
          npm run lint
          npm run build
          npm run lint-build

      - name: Create release tag
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.tag == 'false' && steps.existing.outputs.release == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Request Control $VERSION"
          git push origin "$VERSION"

      - name: Extract release notes
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.release == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text()
          heading = f"## [{version}]"
          start = text.find(heading)
          if start == -1:
              raise SystemExit(f"Missing changelog section for {version}")
          body_start = text.find("\n", start) + 1
          next_heading = text.find("\n## [", body_start)
          body = text[body_start:] if next_heading == -1 else text[body_start:next_heading]
          Path("release-notes.md").write_text(body.strip() + "\n")
          PY

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.release == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Request Control ${{ steps.version.outputs.version }}
          files: web-ext-artifacts/*.zip
          body_path: release-notes.md

      - name: Sign and publish to Mozilla Add-ons
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.release == 'false' && env.WEB_EXT_API_KEY != '' && env.WEB_EXT_API_SECRET != ''
        run: npm run deploy
        env:
          WEB_EXT_CHANNEL: listed

      - name: Note skipped Mozilla signing
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.release == 'false' && (env.WEB_EXT_API_KEY == '' || env.WEB_EXT_API_SECRET == '')
        run: echo "Mozilla signing skipped because WEB_EXT_API_KEY/WEB_EXT_API_SECRET are not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Note existing release
        if: steps.version.outputs.release == 'true' && steps.existing.outputs.release == 'true'
        run: echo "Release ${{ steps.version.outputs.version }} already exists; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
