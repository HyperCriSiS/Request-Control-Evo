name: Diagnose candidate

on:
  push:
    branches:
      - feature/modernization
    paths:
      - .github/workflows/diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - id: ci
        name: Clean install
        continue-on-error: true
        run: npm ci > ci-install.log 2>&1
      - id: test
        name: Unit tests
        if: steps.ci.outcome == 'success'
        continue-on-error: true
        run: npm test -- --ci > ci-test.log 2>&1
      - id: lint
        name: Lint
        if: steps.ci.outcome == 'success'
        continue-on-error: true
        run: npm run lint > ci-lint.log 2>&1
      - name: Save diagnostics
        if: always()
        run: |
          mkdir -p docs/ci-diagnostics
          mv ci-*.log docs/ci-diagnostics/ 2>/dev/null || true
          cat > docs/ci-diagnostics/status.txt <<EOF
          ci=${{ steps.ci.outcome }}
          test=${{ steps.test.outcome }}
          lint=${{ steps.lint.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ci-diagnostics
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture CI diagnostics"
            git push origin HEAD:feature/modernization
          fi
