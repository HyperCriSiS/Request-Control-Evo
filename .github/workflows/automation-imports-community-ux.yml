                    <h3 data-i18n="imports_rule_packages"></h3>
                    <p data-i18n="imports_rule_packages_description"></p>
                </div>
                <details id="recommended-rule-lists" class="imports-section" open>
                    <summary data-i18n="imports_recommended"></summary>
                    <p class="imports-section-description" data-i18n="imports_recommended_description"></p>
                    <ul id="recommended-rule-list"></ul>
                </details>
                <details id="community-rule-lists" class="imports-section">
                    <summary data-i18n="imports_community"></summary>
                    <p class="imports-section-description" data-i18n="imports_community_description"></p>
                    <p id="community-rule-status" class="imports-section-status" data-i18n="imports_community_open_to_load"></p>
                    <ul id="community-rule-list"></ul>
                </details>
