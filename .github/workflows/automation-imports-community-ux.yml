              raw = locale_path.read_text()
              parsed = json.loads(raw)
              missing = {key: value for key, value in additions.items() if key not in parsed}
              if missing:
                  body = raw.rstrip()
                  if not body.endswith("}"):
                      raise RuntimeError(f"invalid locale JSON: {locale}")
                  body = body[:-1].rstrip()
                  lines = [f'  {json.dumps(key, ensure_ascii=False)}: {{"message": {json.dumps(value, ensure_ascii=False)}}}' for key, value in missing.items()]
                  locale_path.write_text(body + ",\n" + ",\n".join(lines) + "\n}\n")

