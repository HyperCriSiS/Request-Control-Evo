name: Apply imports community UX

on:
  push:
    branches:
      - feature/imports-community-ux
    paths:
      - .github/workflows/automation-imports-community-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/imports-community-ux
          fetch-depth: 0

      - name: Apply UI refactor
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {text.count(old)}")
              return text.replace(old, new, 1)

          # options.html
          path = Path("src/options/options.html")
          text = path.read_text()
          if 'id="shareSelectedRulesGitHub"' not in text:
              marker = '''                        <button
                            id="removeSelectedRules"'''
              share = '''                        <button
                            id="shareSelectedRulesGitHub"
                            class="btn btn-selected-action"
                            disabled="disabled"
                            autocomplete="off"
                        >
                            <img src="/icons/ionicons/open-outline.svg" width="16" />
                            <span data-i18n="share_selected_community"></span>
                            <span class="badge badge-light selected-count">0</span>
                        </button>
'''
              if marker not in text:
                  raise RuntimeError("selected-rules toolbar marker missing")
              text = text.replace(marker, share + marker, 1)

          match = re.search(r'            <div id="tab-imports" class="tab-pane">.*?            </div>\n            <div id="tab-settings"', text, re.S)
          if not match:
              raise RuntimeError("imports tab block missing")
