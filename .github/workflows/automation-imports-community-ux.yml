name: Apply imports community UX

on:
  push:
    branches:
      - feature/imports-community-ux
    paths:
      - .github/workflows/automation-imports-community-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/imports-community-ux
          fetch-depth: 0

      - name: Apply verified unified diff
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ""
          open('/tmp/imports-ux.patch', 'wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/imports-ux.patch
          git apply /tmp/imports-ux.patch
          node --check src/options/options.js
          node --check src/options/rule-import-input.js
          node --check test/imports-community-ux.test.js
          git diff --check

      - name: Commit changes and remove automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automation-imports-community-ux.yml
          git add -A
          git commit -m "Simplify imports and community workflow"
          git push origin HEAD:feature/imports-community-ux
