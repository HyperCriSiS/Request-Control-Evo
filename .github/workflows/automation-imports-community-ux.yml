name: Apply imports community UX

on:
  push:
    branches:
      - feature/imports-community-ux
    paths:
      - .github/workflows/automation-imports-community-ux.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/imports-community-ux
          fetch-depth: 0

      - name: Recover and run checked patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              ["git", "show", "fa60fc0430b506f96892b1a85ff9fcc1ea5e44bf:.github/workflows/automation-imports-community-ux.yml"],
              text=True,
          )
          start_marker = "          python <<'PY'\n"
          end_marker = "          PY\n\n          node --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path("/tmp/apply-imports-ux.py").write_text(script)
          PY

          python /tmp/apply-imports-ux.py
          node --check src/options/options.js
          node --check src/options/rule-import-input.js
          node --check test/imports-community-ux.test.js
          git diff --check

      - name: Commit changes and remove automation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automation-imports-community-ux.yml
          git add -A
          git commit -m "Simplify imports and community workflow"
          git push origin HEAD:feature/imports-community-ux
