name: Sync completed 1.19.0 roadmap

on:
  push:
    branches:
      - docs/sync-1.19.0-roadmap
    paths:
      - .github/workflows/automation-sync-1.19.0-roadmap.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/sync-1.19.0-roadmap
          fetch-depth: 0
      - name: Copy finalized roadmap from dev
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev
          git checkout origin/dev -- ROADMAP.md
          rm .github/workflows/automation-sync-1.19.0-roadmap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md .github/workflows/automation-sync-1.19.0-roadmap.yml
          git commit -m "docs: sync completed 1.19.0 roadmap"
          git push origin HEAD:docs/sync-1.19.0-roadmap