name: Setup Pandoc
description: Install the pinned Pandoc binary used by CI and release builds

runs:
  using: composite
  steps:
    - name: Install Pandoc 3.10.2
      shell: bash
      env:
        PANDOC_VERSION: 3.10.2
        PANDOC_SHA256: c7edd535941c48be6a362081a748272837de81ae11777202d9c341d3d8261c9a
      run: |
        set -euo pipefail

        archive="$RUNNER_TEMP/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
        install_dir="$RUNNER_TEMP/pandoc-${PANDOC_VERSION}"

        curl \
          --fail \
          --silent \
          --show-error \
          --location \
          --connect-timeout 15 \
          --max-time 180 \
          --retry 3 \
          --retry-all-errors \
          "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
          --output "$archive"

        printf '%s  %s\n' "$PANDOC_SHA256" "$archive" | sha256sum --check --strict

        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        tar --extract --gzip --file "$archive" --strip-components=1 --directory "$install_dir"

        "$install_dir/bin/pandoc" --version
        echo "$install_dir/bin" >> "$GITHUB_PATH"
